name: "CodeQL config"

# Nothing is filtered here, deliberately.
#
# The csharp job in codeql.yml uses build-mode: manual, so CodeQL extracts everything the real
# `dotnet build` compiles. That includes source-generator output - RegexGenerator.g.cs from
# System.Text.RegularExpressions.Generator and the System.Text.Json.SourceGeneration *.g.cs files -
# which produced 156 style alerts under obj/**/generated/**. Those files cannot be excluded from
# the build, because the partial classes they emit back real [GeneratedRegex] and
# JsonSerializerContext declarations used throughout the library.
#
# A config-file paths-ignore of "**/obj/**" does NOT suppress them: this was tested empirically on
# 2026-09-05 (actions run 33946304824) and CodeQL still emitted all 170 results, the same count as
# a run without it. That matches GitHub's documented behaviour - the config-file paths/paths-ignore
# filter applies to interpreted languages and build-mode: none, not to manual/autobuild. See
# https://github.com/github/docs/blob/main/data/reusables/code-scanning/alerts-found-in-generated-code.md
#
# Generated-code results are therefore stripped from the SARIF instead, in between the analyze and
# upload steps of codeql.yml - see .github/codeql/filter-sarif.py. That removes them by path
# without disabling any query, so cs/useless-cast-to-self, cs/nested-if-statements,
# cs/coupled-types and friends all still report normally against hand-written code.
#
# This file previously carried query-filters excluding cs/unused-label and
# cs/useless-assignment-to-local, because at the time suppressing the whole rule was the only
# lever available. The SARIF filter made that unnecessary, so those exclusions were removed and
# both rules are enabled again.
