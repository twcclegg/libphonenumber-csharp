# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: "create_new_release_on_new_metadata_update"

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      skip_java_check:
        description: 'Continue even when the upstream release changes .java files (only tick this once those changes have been reviewed as not needing a port)'
        type: boolean
        default: false
      skip_proto_check:
        description: 'Continue even when the upstream release changes .proto files'
        type: boolean
        default: false
      dry_run:
        description: 'Report what the run would do and stop before changing anything - nothing is committed, pushed or released'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create_new_release_on_new_metadata_update:
    runs-on: ubuntu-latest
    # Elevated above the read-only default at the job rather than the file level, so a
    # workflow-wide write token is never minted. The update script pushes a commit and
    # creates a GitHub release via GITHUB_TOKEN; actions: write lets it dispatch
    # publish_nuget.yml, which the release's own push event cannot trigger.
    permissions:
      contents: write
      actions: write
    steps:
      # Credentials are persisted on purpose: the update script pushes through this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 10.x
      # DumpLocale.java regenerates resources/locale/country_names.txt from java.util.Locale,
      # so the jdk is an input to the generated file rather than an incidental tool. Pinned
      # to temurin 25 to match the header of the committed file - changing it would rewrite
      # the locale data from a different CLDR version.
      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Get new metadata information and create new GitHub release
        timeout-minutes: 30
        # The token is read from GITHUB_TOKEN below rather than passed as an
        # argument, so it never appears on the process command line.
        run: |
          bash lib/github-actions-metadata-update.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_JAVA_CHECK: ${{ inputs.skip_java_check || false }}
          SKIP_PROTO_CHECK: ${{ inputs.skip_proto_check || false }}
          DRY_RUN: ${{ inputs.dry_run || false }}
