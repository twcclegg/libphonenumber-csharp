name: build_and_run_demo_tests

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'csharp/PhoneNumbers.Demo/**'
      - 'csharp/PhoneNumbers.Demo.Tests/**'
      - 'csharp/PhoneNumbers/**'
      - 'csharp/PhoneNumbers.Extensions/**'
      # Shared build settings and package versions apply to the demo projects too.
      - 'csharp/Directory.Build.props'
      - 'csharp/Directory.Packages.props'
      - 'resources/**'
      - '.github/workflows/build_and_run_demo_tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build_and_run_demo_tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 10.x
      - name: Restore dependencies
        run: dotnet restore PhoneNumbers.Demo.Tests/PhoneNumbers.Demo.Tests.csproj
        working-directory: ./csharp
      - name: Build
        run: dotnet build PhoneNumbers.Demo.Tests/PhoneNumbers.Demo.Tests.csproj --no-restore
        working-directory: ./csharp
      - name: Test demo project
        run: dotnet test PhoneNumbers.Demo.Tests/PhoneNumbers.Demo.Tests.csproj --no-build --verbosity normal
        working-directory: ./csharp
