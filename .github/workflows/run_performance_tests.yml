name: run_performance_tests

# Benchmarking is the longest job in the repo, so it only runs when something it measures could have
# moved. PhoneNumbers is listed because PerformanceTest is not in the solution: nothing else compiles
# it, so without this a library change could break the benchmarks unnoticed.
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'csharp/PhoneNumbers/**'
      - 'csharp/PhoneNumbers.PerformanceTest/**'
      - 'csharp/Directory.Build.props'
      - 'csharp/Directory.Packages.props'
      - 'resources/**'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/run_performance_tests.yml'
  # Keeps a run against main in the Actions history; there is nothing to compare it to.
  # GitHub Actions does not support YAML anchors, so this list is duplicated rather than shared.
  push:
    branches: [ "main" ]
    paths:
      - 'csharp/PhoneNumbers/**'
      - 'csharp/PhoneNumbers.PerformanceTest/**'
      - 'csharp/Directory.Build.props'
      - 'csharp/Directory.Packages.props'
      - 'resources/**'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/run_performance_tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  run_performance_tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      # The "Build both benchmark trees" step below runs two `dotnet build` invocations
      # concurrently, and this is the only workflow that does - everywhere else, an earlier
      # sequential `dotnet restore`/`build` step already completes the SDK's one-time setup
      # (NuGet migrations, telemetry sentinel) before anything runs in parallel. Here, both
      # concurrent invocations can race to perform that setup at once, racing on the same
      # mkdir/mutex and failing with "The system cannot open the device or file specified" /
      # EEXIST. Skipping first-time setup entirely removes the race instead of reordering
      # around it.
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the PR's base commit can be checked out and benchmarked here.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 10.x

      # Central Package Management keeps every version in one file, so hashing it plus the project
      # files is enough to invalidate this when a dependency moves. Deliberately not added to
      # publish_nuget.yml: the release path should resolve from nuget.org rather than a mutable cache.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('csharp/Directory.Packages.props', 'csharp/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Check out the PR base alongside the branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add /tmp/base-tree "${BASE_SHA}"
          echo "comparing against base ${BASE_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      # Compiling both trees at once overlaps two restores and two rounds of metadata generation.
      # The MetadataBuilder mutex is keyed on the output directory, so the trees do not contend.
      # Only the builds overlap: running the benchmarks concurrently would have them competing for
      # the same cores and make both sets of numbers meaningless.
      - name: Build both benchmark trees
        run: |
          pids=""
          dotnet build -c Release --framework net10.0 csharp/PhoneNumbers.PerformanceTest &
          pids="$!"
          if [ -d /tmp/base-tree ]
          then
            dotnet build -c Release --framework net10.0 /tmp/base-tree/csharp/PhoneNumbers.PerformanceTest &
            pids="${pids} $!"
          fi
          failed=0
          for pid in ${pids}
          do
            wait "${pid}" || failed=1
          done
          if [ "${failed}" -ne 0 ]
          then
            echo "error: a benchmark tree failed to build" >&2
            exit 1
          fi

      # Measure the base commit on THIS runner, in THIS job, rather than reusing a cached
      # baseline measured on some earlier runner. Cross-machine variance on shared runners
      # is a few percent, which is the same size as the differences we are trying to detect,
      # so a cached baseline cannot support a conclusion either way.
      # Base runs first, so any warm-up bias favours the branch; treat sub-percent deltas as
      # noise regardless.
      - name: Benchmark the PR base
        if: github.event_name == 'pull_request'
        run: |
          cd /tmp/base-tree/csharp/PhoneNumbers.PerformanceTest
          dotnet run -c Release --framework net10.0 --no-build -- --filter "*"

      - name: Run benchmarks
        run: dotnet run -c Release --framework net10.0 --no-build -- --filter "*"
        working-directory: ./csharp/PhoneNumbers.PerformanceTest

      # Bundle both sets of results so the follow-up workflow can post the comparison.
      - name: Stage benchmark artifact
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Head SHA, not the merge SHA in GITHUB_SHA.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          stage="benchmark-artifact"
          mkdir -p "${stage}/branch-results" "${stage}/main-results"

          pr_dir="csharp/PhoneNumbers.PerformanceTest/BenchmarkDotNet.Artifacts/results"
          base_dir="/tmp/base-tree/csharp/PhoneNumbers.PerformanceTest/BenchmarkDotNet.Artifacts/results"
          if [ -d "${pr_dir}" ]
          then
            cp "${pr_dir}"/*-report-github.md "${stage}/branch-results/" 2> /dev/null || true
          fi
          if [ -d "${base_dir}" ]
          then
            cp "${base_dir}"/*-report-github.md "${stage}/main-results/" 2> /dev/null || true
          fi

          # A missing baseline would otherwise post a one-sided comment that reads like a result.
          if [ -z "$(ls -A "${stage}/main-results")" ]
          then
            echo "error: no base benchmark results found at ${base_dir}" >&2
            exit 1
          fi

          jq -n --argjson pr_number "${PR_NUMBER}" --arg head_sha "${HEAD_SHA}" \
            '{pr_number: $pr_number, head_sha: $head_sha}' > "${stage}/pr-info.json"

          find "${stage}" -type f

      - name: Upload benchmark artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: benchmark-artifact/
          retention-days: 7
          if-no-files-found: error

      # BenchmarkDotNet exits 0 even when a benchmark throws — it reports that row as NA and carries
      # on. Without this the job stays green while measuring nothing. Runs after the upload so the
      # partial results are still available for diagnosis.
      - name: Fail on benchmarks that produced no result
        run: |
          failed=0
          for dir in \
            "csharp/PhoneNumbers.PerformanceTest/BenchmarkDotNet.Artifacts/results" \
            "/tmp/base-tree/csharp/PhoneNumbers.PerformanceTest/BenchmarkDotNet.Artifacts/results"
          do
            if [ ! -d "${dir}" ]
            then
              continue
            fi
            if grep -hE '\|[[:space:]]*NA[[:space:]]*\|' "${dir}"/*-report-github.md 2> /dev/null
            then
              echo "error: the rows above from ${dir} have no measurement" >&2
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]
          then
            exit 1
          fi
          echo "every benchmark produced a result"
