name: run_performance_tests

on:
  pull_request:
    branches: [ "main" ]
  # Keeps a run against main in the Actions history; there is nothing to compare it to.
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  run_performance_tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the PR's base commit can be checked out and benchmarked here.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 10.x

      # Measure the base commit on THIS runner, in THIS job, rather than reusing a cached
      # baseline measured on some earlier runner. Cross-machine variance on shared runners
      # is a few percent, which is the same size as the differences we are trying to detect,
      # so a cached baseline cannot support a conclusion either way.
      # Base runs first, so any warm-up bias favours the branch; treat sub-percent deltas as
      # noise regardless.
      - name: Benchmark the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add /tmp/base-tree "${BASE_SHA}"
          echo "benchmarking base ${BASE_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          cd /tmp/base-tree/csharp/PhoneNumbers.PerformanceTest
          dotnet run -c Release --framework net10.0 -- --filter "*"

      - name: Run benchmarks
        run: dotnet run -c Release --framework net10.0 -- --filter "*"
        working-directory: ./csharp/PhoneNumbers.PerformanceTest

      # Bundle both sets of results so the follow-up workflow can post the comparison.
      - name: Stage benchmark artifact
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Head SHA, not the merge SHA in GITHUB_SHA.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          stage="benchmark-artifact"
          mkdir -p "${stage}/branch-results" "${stage}/main-results"

          pr_dir="csharp/PhoneNumbers.PerformanceTest/BenchmarkDotNet.Artifacts/results"
          base_dir="/tmp/base-tree/csharp/PhoneNumbers.PerformanceTest/BenchmarkDotNet.Artifacts/results"
          if [ -d "${pr_dir}" ]
          then
            cp "${pr_dir}"/*-report-github.md "${stage}/branch-results/" 2> /dev/null || true
          fi
          if [ -d "${base_dir}" ]
          then
            cp "${base_dir}"/*-report-github.md "${stage}/main-results/" 2> /dev/null || true
          fi

          # A missing baseline would otherwise post a one-sided comment that reads like a result.
          if [ -z "$(ls -A "${stage}/main-results")" ]
          then
            echo "error: no base benchmark results found at ${base_dir}" >&2
            exit 1
          fi

          jq -n --argjson pr_number "${PR_NUMBER}" --arg head_sha "${HEAD_SHA}" \
            '{pr_number: $pr_number, head_sha: $head_sha}' > "${stage}/pr-info.json"

          find "${stage}" -type f

      - name: Upload benchmark artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: benchmark-artifact/
          retention-days: 7
          if-no-files-found: error

      # BenchmarkDotNet exits 0 even when a benchmark throws — it reports that row as NA and carries
      # on. Without this the job stays green while measuring nothing. Runs after the upload so the
      # partial results are still available for diagnosis.
      - name: Fail on benchmarks that produced no result
        run: |
          failed=0
          for dir in \
            "csharp/PhoneNumbers.PerformanceTest/BenchmarkDotNet.Artifacts/results" \
            "/tmp/base-tree/csharp/PhoneNumbers.PerformanceTest/BenchmarkDotNet.Artifacts/results"
          do
            if [ ! -d "${dir}" ]
            then
              continue
            fi
            if grep -hE '\|[[:space:]]*NA[[:space:]]*\|' "${dir}"/*-report-github.md 2> /dev/null
            then
              echo "error: the rows above from ${dir} have no measurement" >&2
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]
          then
            exit 1
          fi
          echo "every benchmark produced a result"
