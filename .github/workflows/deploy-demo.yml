name: Deploy Demo & Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'csharp/PhoneNumbers.Demo/**'
      - 'csharp/PhoneNumbers/**'
      - 'csharp/PhoneNumbers.Extensions/**'
      # Shared build settings and package versions apply to the demo and docs builds too.
      - 'csharp/Directory.Build.props'
      - 'csharp/Directory.Packages.props'
      - 'resources/**'
      - 'docs/**'
      - 'docfx/**'
      - '.github/workflows/deploy-demo.yml'
  schedule:
    # Rebuild weekly to pick up any NuGet dependency updates
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: Publish Blazor WASM app
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          dotnet publish csharp/PhoneNumbers.Demo/PhoneNumbers.Demo.csproj -c Release -o release -p:PathBase=/${REPO_NAME}/

      - name: Build API docs site
        run: ./docfx/build.sh

      - name: Configure for GitHub Pages
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll
          cp -r docfx/_site release/wwwroot/docs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: release/wwwroot

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
