# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      # init/analyze/upload-sarif must move together — the CodeQL Action
      # refuses to run when init and analyze are different versions.
      codeql-action:
        patterns:
        - "github/codeql-action*"
  # Every package version lives in csharp/Directory.Packages.props, so one entry covers
  # all projects instead of one per project directory.
  - package-ecosystem: "nuget"
    directory: "/csharp"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      nuget_minor_patch_updates:
        update-types:
        - "minor"
        - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
