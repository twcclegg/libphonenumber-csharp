items:
- uid: PhoneNumbers.PhoneNumberMatcher.CheckGroups
  commentId: T:PhoneNumbers.PhoneNumberMatcher.CheckGroups
  id: PhoneNumberMatcher.CheckGroups
  parent: PhoneNumbers
  children: []
  langs:
  - csharp
  - vb
  name: PhoneNumberMatcher.CheckGroups
  nameWithType: PhoneNumberMatcher.CheckGroups
  fullName: PhoneNumbers.PhoneNumberMatcher.CheckGroups
  type: Delegate
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Returns true if the groups of digits found in our candidate phone number match our

    expectations.
  example: []
  syntax:
    content: public delegate bool PhoneNumberMatcher.CheckGroups(PhoneNumberUtil util, PhoneNumber number, StringBuilder normalizedCandidate, IList<string> expectedNumberGroups)
    parameters:
    - id: util
      type: PhoneNumbers.PhoneNumberUtil
      description: ''
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the original number we found when parsing
    - id: normalizedCandidate
      type: System.Text.StringBuilder
      description: >-
        the candidate number, normalized to only contain ASCII digits,
                but with non-digits (spaces etc) retained
    - id: expectedNumberGroups
      type: System.Collections.Generic.IList{System.String}
      description: >-
        the groups of digits that we would expect to see if we
                formatted this number
    return:
      type: System.Boolean
    content.vb: Public Delegate Function PhoneNumberMatcher.CheckGroups(util As PhoneNumberUtil, number As PhoneNumber, normalizedCandidate As StringBuilder, expectedNumberGroups As IList(Of String)) As Boolean
