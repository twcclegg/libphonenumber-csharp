- uid: PhoneNumbers.PhoneNumberToTimeZonesMapper.GetTimeZonesForGeographicalNumber(PhoneNumbers.PhoneNumber)
  commentId: M:PhoneNumbers.PhoneNumberToTimeZonesMapper.GetTimeZonesForGeographicalNumber(PhoneNumbers.PhoneNumber)
  id: GetTimeZonesForGeographicalNumber(PhoneNumbers.PhoneNumber)
  parent: PhoneNumbers.PhoneNumberToTimeZonesMapper
  langs:
  - csharp
  - vb
  name: GetTimeZonesForGeographicalNumber(PhoneNumber)
  nameWithType: PhoneNumberToTimeZonesMapper.GetTimeZonesForGeographicalNumber(PhoneNumber)
  fullName: PhoneNumbers.PhoneNumberToTimeZonesMapper.GetTimeZonesForGeographicalNumber(PhoneNumbers.PhoneNumber)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Returns a list of time zones to which a phone number belongs.

    This method assumes the validity of the number passed in has already been checked, and that

    the number is geo-localizable. We consider fixed-line and mobile numbers possible candidates

    for geo-localization.


    param number  a valid phone number for which we want to get the time zones to which it belongs

    return  a list of the corresponding time zones or a single element list with the default
        unknown time zone if no other time zone was found or if the number was invalid
  example: []
  syntax:
    content: public List<string> GetTimeZonesForGeographicalNumber(PhoneNumber number)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: a valid phone number for which we want to get the time zones to which it belongs
    return:
      type: System.Collections.Generic.List{System.String}
      description: >-
        a list of the corresponding time zones or a single element list with the default

        unknown time zone if no other time zone was found or if the number was invalid
    content.vb: Public Function GetTimeZonesForGeographicalNumber(number As PhoneNumber) As List(Of String)
  overload: PhoneNumbers.PhoneNumberToTimeZonesMapper.GetTimeZonesForGeographicalNumber*
