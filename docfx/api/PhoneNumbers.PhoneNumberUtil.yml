  - csharp
  - vb
  name: MaybeExtractCountryCode(string, PhoneMetadata, StringBuilder, bool, Builder)
  nameWithType: PhoneNumberUtil.MaybeExtractCountryCode(string, PhoneMetadata, StringBuilder, bool, PhoneNumber.Builder)
  fullName: PhoneNumbers.PhoneNumberUtil.MaybeExtractCountryCode(string, PhoneNumbers.PhoneMetadata, System.Text.StringBuilder, bool, PhoneNumbers.PhoneNumber.Builder)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Tries to extract a country calling code from a number. This method will return zero if no

    country calling code is considered to be present. Country calling codes are extracted in the

    following ways:


    <ul>
     <li> by stripping the international dialing prefix of the region the person is dialing from,
          if this is present in the number, and looking at the next digits</li>
     <li> by stripping the '+' sign if present and then looking at the next digits</li>
     <li> by comparing the start of the number and the country calling code of the default region.
          If the number is not considered possible for the numbering plan of the default region
          initially, but starts with the country calling code of this region, validation will be
          reattempted after stripping this country calling code. If this number is considered a
          possible number, then the first digits will be considered the country calling code and
          removed as such.</li>
    </ul>


    It will throw a NumberParseException if the number starts with a '+' but the country calling

    code supplied after this does not match that of any known region.
  example: []
  syntax:
    content: public int MaybeExtractCountryCode(string number, PhoneMetadata defaultRegionMetadata, StringBuilder nationalNumber, bool keepRawInput, PhoneNumber.Builder phoneNumber)
    parameters:
    - id: number
      type: System.String
      description: >-
        non-normalized telephone number that we wish to extract a country calling
                 code from - may begin with '+'
    - id: defaultRegionMetadata
      type: PhoneNumbers.PhoneMetadata
      description: metadata about the region this number may be from
    - id: nationalNumber
      type: System.Text.StringBuilder
      description: >-
        a string buffer to store the national significant number in, in the case
                 that a country calling code was extracted. The number is appended to any existing contents.
                 If no country calling code was extracted, this will be left unchanged.
    - id: keepRawInput
      type: System.Boolean
      description: >-
        true if the country_code_source and preferred_carrier_code fields of
                 phoneNumber should be populated.
    - id: phoneNumber
      type: PhoneNumbers.PhoneNumber.Builder
      description: >-
        the PhoneNumber object where the country_code and country_code_source need
                 to be populated. Note the country_code is always populated, whereas country_code_source is
                 only populated when keepCountryCodeSource is true.
    return:
      type: System.Int32
      description: the country calling code extracted or 0 if none could be extracted
    content.vb: Public Function MaybeExtractCountryCode(number As String, defaultRegionMetadata As PhoneMetadata, nationalNumber As StringBuilder, keepRawInput As Boolean, phoneNumber As PhoneNumber.Builder) As Integer
  overload: PhoneNumbers.PhoneNumberUtil.MaybeExtractCountryCode*
  nameWithType.vb: PhoneNumberUtil.MaybeExtractCountryCode(String, PhoneMetadata, StringBuilder, Boolean, PhoneNumber.Builder)
  fullName.vb: PhoneNumbers.PhoneNumberUtil.MaybeExtractCountryCode(String, PhoneNumbers.PhoneMetadata, System.Text.StringBuilder, Boolean, PhoneNumbers.PhoneNumber.Builder)
  name.vb: MaybeExtractCountryCode(String, PhoneMetadata, StringBuilder, Boolean, Builder)
