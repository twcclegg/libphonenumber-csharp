  nameWithType: PhoneNumberUtil.Parse(string, string)
  fullName: PhoneNumbers.PhoneNumberUtil.Parse(string, string)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Parses a string and returns it in proto buffer format. This method will throw a

    <xref href="PhoneNumbers.NumberParseException" data-throw-if-not-resolved="false"></xref> if the number is not considered to be

    a possible number. Note that validation of whether the number is actually a valid number for a

    particular region is not performed. This can be done separately with <xref href="PhoneNumbers.PhoneNumberUtil.IsValidNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public PhoneNumber Parse(string numberToParse, string defaultRegion)
    parameters:
    - id: numberToParse
      type: System.String
      description: >-
        Number that we are attempting to parse. This can contain formatting
            such as +, ( and -, as well as a phone number extension. It can also
            be provided in RFC3966 format.
    - id: defaultRegion
      type: System.String
      description: >-
        Region that we are expecting the number to be from. This is only used
            if the number being parsed is not written in international format.
            The country_code for the number in this case would be stored as that
            of the default region supplied. If the number is guaranteed to
            start with a '+' followed by the country calling code, then "ZZ" or
            null can be supplied.
    return:
      type: PhoneNumbers.PhoneNumber
      description: A phone number proto buffer filled with the parsed number
    content.vb: Public Function Parse(numberToParse As String, defaultRegion As String) As PhoneNumber
  overload: PhoneNumbers.PhoneNumberUtil.Parse*
