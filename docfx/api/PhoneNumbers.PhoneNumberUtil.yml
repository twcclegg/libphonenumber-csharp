  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Formats a phone number in national format for dialing using the carrier as specified in the

    preferredDomesticCarrierCode field of the PhoneNumber object passed in. If that is missing,

    use the fallbackCarrierCode passed in instead. If there is no

    preferredDomesticCarrierCode, and the fallbackCarrierCode contains an empty

    string, return the number in national format without any carrier code.


    <p>Use <xref href="PhoneNumbers.PhoneNumberUtil.FormatNationalNumberWithCarrierCode(PhoneNumbers.PhoneNumber%2cSystem.String)" data-throw-if-not-resolved="false"></xref> instead if the carrier code passed in

    should take precedence over the number's preferredDomesticCarrierCode when formatting.</p>
  example: []
  syntax:
    content: public string FormatNationalNumberWithPreferredCarrierCode(PhoneNumber number, string fallbackCarrierCode)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: The phone number to be formatted.
    - id: fallbackCarrierCode
      type: System.String
      description: >-
        The carrier selection code to be used, if none is found in the
             phone number itself.
    return:
      type: System.String
      description: >-
        The formatted phone number in national format for dialing using the number's
             preferredDomesticCarrierCode, or the fallbackCarrierCode passed in if
             none is found.
    content.vb: Public Function FormatNationalNumberWithPreferredCarrierCode(number As PhoneNumber, fallbackCarrierCode As String) As String
