- uid: PhoneNumbers.PhoneNumberUtil.FormatOutOfCountryCallingNumber(PhoneNumbers.PhoneNumber,System.String)
  commentId: M:PhoneNumbers.PhoneNumberUtil.FormatOutOfCountryCallingNumber(PhoneNumbers.PhoneNumber,System.String)
  id: FormatOutOfCountryCallingNumber(PhoneNumbers.PhoneNumber,System.String)
  parent: PhoneNumbers.PhoneNumberUtil
  langs:
  - csharp
  - vb
  name: FormatOutOfCountryCallingNumber(PhoneNumber, string)
  nameWithType: PhoneNumberUtil.FormatOutOfCountryCallingNumber(PhoneNumber, string)
  fullName: PhoneNumbers.PhoneNumberUtil.FormatOutOfCountryCallingNumber(PhoneNumbers.PhoneNumber, string)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Formats a phone number for out-of-country dialing purposes.If no regionCallingFrom is

    supplied, we format the number in its INTERNATIONAL format.If the country calling code is the

    same as that of the region where the number is from, then NATIONAL formatting will be applied.


    <p>

    If the number itself has a country calling code of zero or an otherwise invalid country

    calling code, then we return the number with no formatting applied.

    </p>

    <p>

    Note this function takes care of the case for calling inside of NANPA and between Russia and

    Kazakhstan (who share the same country calling code). In those cases, no international prefix

    is used.For regions which have multiple international prefixes, the number in its

    INTERNATIONAL format will be returned instead.

    </p>
  example: []
  syntax:
    content: public string FormatOutOfCountryCallingNumber(PhoneNumber number, string regionCallingFrom)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: The phone number to be formatted.
    - id: regionCallingFrom
      type: System.String
      description: The region where the call is being placed.
    return:
      type: System.String
      description: The formatted phone number.
    content.vb: Public Function FormatOutOfCountryCallingNumber(number As PhoneNumber, regionCallingFrom As String) As String
  overload: PhoneNumbers.PhoneNumberUtil.FormatOutOfCountryCallingNumber*
  nameWithType.vb: PhoneNumberUtil.FormatOutOfCountryCallingNumber(PhoneNumber, String)
  fullName.vb: PhoneNumbers.PhoneNumberUtil.FormatOutOfCountryCallingNumber(PhoneNumbers.PhoneNumber, String)
  name.vb: FormatOutOfCountryCallingNumber(PhoneNumber, String)
- uid: PhoneNumbers.PhoneNumberUtil.FormatOutOfCountryKeepingAlphaChars(PhoneNumbers.PhoneNumber,System.String)
  commentId: M:PhoneNumbers.PhoneNumberUtil.FormatOutOfCountryKeepingAlphaChars(PhoneNumbers.PhoneNumber,System.String)
  id: FormatOutOfCountryKeepingAlphaChars(PhoneNumbers.PhoneNumber,System.String)
  parent: PhoneNumbers.PhoneNumberUtil
  langs:
  - csharp
  - vb
  name: FormatOutOfCountryKeepingAlphaChars(PhoneNumber, string)
  nameWithType: PhoneNumberUtil.FormatOutOfCountryKeepingAlphaChars(PhoneNumber, string)
  fullName: PhoneNumbers.PhoneNumberUtil.FormatOutOfCountryKeepingAlphaChars(PhoneNumbers.PhoneNumber, string)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Formats a phone number for out-of-country dialing purposes.

    Note that in this version, if the number was entered originally using alpha characters and

    this version of the number is stored in raw_input, this representation of the number will be

    used rather than the digit representation. Grouping information, as specified by characters

    such as "-" and " ", will be retained.


    <p>

    <b>Caveats:</b>

    </p>

    <ul>

    <li>

    This will not produce good results if the country calling code is both present in the raw

    input _and_ is the start of the national number. This is not a problem in the regions

    which typically use alpha numbers.

    </li>

    <li>

    This will also not produce good results if the raw input has any grouping information

    within the first three digits of the national number, and if the function needs to strip

    preceding digits/words in the raw input before these digits. Normally people group the

    first three digits together so this is not a huge problem - and will be fixed if it

    proves to be so.

    </li>

    </ul>
  example: []
  syntax:
    content: public string FormatOutOfCountryKeepingAlphaChars(PhoneNumber number, string regionCallingFrom)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the phone number that needs to be formatted
    - id: regionCallingFrom
      type: System.String
      description: the region where the call is being placed
    return:
      type: System.String
      description: the formatted phone number
    content.vb: Public Function FormatOutOfCountryKeepingAlphaChars(number As PhoneNumber, regionCallingFrom As String) As String
  overload: PhoneNumbers.PhoneNumberUtil.FormatOutOfCountryKeepingAlphaChars*
  nameWithType.vb: PhoneNumberUtil.FormatOutOfCountryKeepingAlphaChars(PhoneNumber, String)
  fullName.vb: PhoneNumbers.PhoneNumberUtil.FormatOutOfCountryKeepingAlphaChars(PhoneNumbers.PhoneNumber, String)
  name.vb: FormatOutOfCountryKeepingAlphaChars(PhoneNumber, String)
