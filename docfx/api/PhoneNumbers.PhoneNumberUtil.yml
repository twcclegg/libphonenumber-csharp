- uid: PhoneNumbers.PhoneNumberUtil.GetLengthOfGeographicalAreaCode(PhoneNumbers.PhoneNumber)
  commentId: M:PhoneNumbers.PhoneNumberUtil.GetLengthOfGeographicalAreaCode(PhoneNumbers.PhoneNumber)
  id: GetLengthOfGeographicalAreaCode(PhoneNumbers.PhoneNumber)
  parent: PhoneNumbers.PhoneNumberUtil
  langs:
  - csharp
  - vb
  name: GetLengthOfGeographicalAreaCode(PhoneNumber)
  nameWithType: PhoneNumberUtil.GetLengthOfGeographicalAreaCode(PhoneNumber)
  fullName: PhoneNumbers.PhoneNumberUtil.GetLengthOfGeographicalAreaCode(PhoneNumbers.PhoneNumber)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Gets the length of the geographical area code from the

    PhoneNumber object passed in, so that clients could use it

    to split a national significant number into geographical area code and subscriber number. It

    works in such a way that the resultant subscriber number should be diallable, at least on some

    devices. An example of how this could be used:


    <pre><code class="lang-csharp">var phoneUtil = PhoneNumberUtil.getInstance();

    var number = phoneUtil.parse("16502530000", "US");

    var nationalSignificantNumber = phoneUtil.getNationalSignificantNumber(number);

    string areaCode;

    string subscriberNumber;


    var areaCodeLength = phoneUtil.getLengthOfGeographicalAreaCode(number);

    if (areaCodeLength &gt; 0)

    {
      areaCode = nationalSignificantNumber.substring(0, areaCodeLength);
      subscriberNumber = nationalSignificantNumber.substring(areaCodeLength);
    }

    else {
      areaCode = "";
      subscriberNumber = nationalSignificantNumber;
    }</code></pre>


    N.B.: area code is a very ambiguous concept, so the I18N team generally recommends against

    using it for most purposes, but recommends using the more general <code>NationalNumber</code>

    instead. Read the following carefully before deciding to use this method:


    <ul>
     <li> geographical area codes change over time, and this method honors those changes;
       therefore, it doesn't guarantee the stability of the result it produces.</li>
     <li> subscriber numbers may not be diallable from all devices (notably mobile devices, which
       typically requires the full NationalNumber to be dialled in most regions).</li>
     <li> most non-geographical numbers have no area codes, including numbers from non-geographical
       entities</li>
     <li> some geographical numbers have no area codes.</li>
    </ul>
  example: []
  syntax:
    content: public int GetLengthOfGeographicalAreaCode(PhoneNumber number)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the PhoneNumber object for which clients want to know the length of the area code
    return:
      type: System.Int32
      description: the length of area code of the PhoneNumber object passed in
    content.vb: Public Function GetLengthOfGeographicalAreaCode(number As PhoneNumber) As Integer
  overload: PhoneNumbers.PhoneNumberUtil.GetLengthOfGeographicalAreaCode*
- uid: PhoneNumbers.PhoneNumberUtil.GetLengthOfNationalDestinationCode(PhoneNumbers.PhoneNumber)
  commentId: M:PhoneNumbers.PhoneNumberUtil.GetLengthOfNationalDestinationCode(PhoneNumbers.PhoneNumber)
  id: GetLengthOfNationalDestinationCode(PhoneNumbers.PhoneNumber)
  parent: PhoneNumbers.PhoneNumberUtil
  langs:
  - csharp
  - vb
  name: GetLengthOfNationalDestinationCode(PhoneNumber)
  nameWithType: PhoneNumberUtil.GetLengthOfNationalDestinationCode(PhoneNumber)
  fullName: PhoneNumbers.PhoneNumberUtil.GetLengthOfNationalDestinationCode(PhoneNumbers.PhoneNumber)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Gets the length of the national destination code (NDC) from the

    PhoneNumber object passed in, so that clients could use it

    to split a national significant number into NDC and subscriber number. The NDC of a phone

    number is normally the first group of digit(s) right after the country calling code when the

    number is formatted in the international format, if there is a subscriber number part that

    follows.


    N.B.: similar to an area code, not all numbers have an NDC!


    An example of how this could be used:


    <pre><code class="lang-csharp">var phoneUtil = PhoneNumberUtil.getInstance();

    var number = phoneUtil.parse("18002530000", "US");

    var nationalSignificantNumber = phoneUtil.getNationalSignificantNumber(number);

    string nationalDestinationCode;

    string subscriberNumber;


    var nationalDestinationCodeLength = phoneUtil.getLengthOfNationalDestinationCode(number);

    if (nationalDestinationCodeLength &gt; 0)

    {
      nationalDestinationCode = nationalSignificantNumber.substring(0,
          nationalDestinationCodeLength);
      subscriberNumber = nationalSignificantNumber.substring(nationalDestinationCodeLength);
    }

    else

    {
      nationalDestinationCode = "";
      subscriberNumber = nationalSignificantNumber;
    }</code></pre>


    Refer to the unit tests to see the difference between this function and

    <xref href="PhoneNumbers.PhoneNumberUtil.GetLengthOfGeographicalAreaCode(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public int GetLengthOfNationalDestinationCode(PhoneNumber number)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the PhoneNumber object for which clients want to know the length of the NDC.
    return:
      type: System.Int32
      description: the length of NDC of the PhoneNumber object passed in, which could be zero
    content.vb: Public Function GetLengthOfNationalDestinationCode(number As PhoneNumber) As Integer
  overload: PhoneNumbers.PhoneNumberUtil.GetLengthOfNationalDestinationCode*
