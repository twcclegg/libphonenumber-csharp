  name: PhoneNumberUtil
  nameWithType: PhoneNumberUtil
  fullName: PhoneNumbers.PhoneNumberUtil
  type: Class
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Utility for international phone numbers. Functionality includes formatting, parsing and

    validation.


    <p>

    If you use this library, and want to be notified about important changes, please sign up to

    our mailing list: http://groups.google.com/group/libphonenumber-discuss/about

    </p>


    NOTE: A lot of methods in this class require Region Code strings.These must be provided using

    ISO 3166-1 two-letter country-code format.These should be in upper-case. The list of the codes

    can be found here:

    http://www.iso.org/iso/country_codes/iso_3166_code_lists/country_names_and_code_elements.htm

    <!--

    @author Shaopeng Jia

    @author Lara Rennie

    -->
