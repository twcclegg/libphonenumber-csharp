- uid: PhoneNumbers.PhoneNumberUtil.Normalize(System.String)
  commentId: M:PhoneNumbers.PhoneNumberUtil.Normalize(System.String)
  id: Normalize(System.String)
  parent: PhoneNumbers.PhoneNumberUtil
  langs:
  - csharp
  - vb
  name: Normalize(string?)
  nameWithType: PhoneNumberUtil.Normalize(string?)
  fullName: PhoneNumbers.PhoneNumberUtil.Normalize(string?)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Normalizes a string of characters representing a phone number. This performs the following

    conversions:

    Punctuation is stripped.

    For ALPHA/VANITY numbers:

    Letters are converted to their numeric representation on a telephone keypad. The keypad

    used here is the one defined in ITU Recommendation E.161. This is only done if there are

    3 or more letters in the number, to lessen the risk that such letters are typos.

    For other numbers:

    Wide-ascii digits are converted to normal ASCII (European) digits.

    Arabic-Indic numerals are converted to European numerals.

    Spurious alpha characters are stripped.

    Arabic-Indic numerals are converted to European numerals.
  example: []
  syntax:
    content: public static string Normalize(string? number)
    parameters:
    - id: number
      type: System.String
      description: A string of characters representing a phone number.
    return:
      type: System.String
      description: The normalized string version of the phone number.
    content.vb: Public Shared Function Normalize(number As String) As String
  overload: PhoneNumbers.PhoneNumberUtil.Normalize*
  nameWithType.vb: PhoneNumberUtil.Normalize(String)
  fullName.vb: PhoneNumbers.PhoneNumberUtil.Normalize(String)
  name.vb: Normalize(String)
