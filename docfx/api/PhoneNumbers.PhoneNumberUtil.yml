- uid: PhoneNumbers.PhoneNumberUtil.IsPossibleNumberWithReason(PhoneNumbers.PhoneNumber)
  commentId: M:PhoneNumbers.PhoneNumberUtil.IsPossibleNumberWithReason(PhoneNumbers.PhoneNumber)
  id: IsPossibleNumberWithReason(PhoneNumbers.PhoneNumber)
  parent: PhoneNumbers.PhoneNumberUtil
  langs:
  - csharp
  - vb
  name: IsPossibleNumberWithReason(PhoneNumber)
  nameWithType: PhoneNumberUtil.IsPossibleNumberWithReason(PhoneNumber)
  fullName: PhoneNumbers.PhoneNumberUtil.IsPossibleNumberWithReason(PhoneNumbers.PhoneNumber)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Check whether a phone number is a possible number. It provides a more lenient check than

    <xref href="PhoneNumbers.PhoneNumberUtil.IsValidNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref> in the following sense:


    <ol>
      <li> It only checks the length of phone numbers. In particular, it doesn't check starting
           digits of the number. </li>
      <li> It doesn't attempt to figure out the type of the number, but uses general rules which
           applies to all types of phone numbers in a region. Therefore, it is much faster than
           isValidNumber. </li>
      <li> For some numbers (particularly fixed-line), many regions have the concept of area code,
           which together with subscriber number constitute the national significant number. It is
           sometimes okay to dial only the subscriber number when dialing in the same area. This
           function will return IS_POSSIBLE_LOCAL_ONLY if the subscriber-number-only version is
           passed in. On the other hand, because isValidNumber validates using information on both
           starting digits (for fixed line numbers, that would most likely be area codes) and
           length (obviously includes the length of area codes for fixed line numbers), it will
           return false for the subscriber-number-only version. </li>
    </ol>
  example: []
  syntax:
    content: public PhoneNumberUtil.ValidationResult IsPossibleNumberWithReason(PhoneNumber number)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the number that needs to be checked
    return:
      type: PhoneNumbers.PhoneNumberUtil.ValidationResult
      description: a ValidationResult object which indicates whether the number is possible
    content.vb: Public Function IsPossibleNumberWithReason(number As PhoneNumber) As PhoneNumberUtil.ValidationResult
  overload: PhoneNumbers.PhoneNumberUtil.IsPossibleNumberWithReason*
- uid: PhoneNumbers.PhoneNumberUtil.IsPossibleNumberForTypeWithReason(PhoneNumbers.PhoneNumber,PhoneNumbers.PhoneNumberType)
  commentId: M:PhoneNumbers.PhoneNumberUtil.IsPossibleNumberForTypeWithReason(PhoneNumbers.PhoneNumber,PhoneNumbers.PhoneNumberType)
  id: IsPossibleNumberForTypeWithReason(PhoneNumbers.PhoneNumber,PhoneNumbers.PhoneNumberType)
  parent: PhoneNumbers.PhoneNumberUtil
  langs:
  - csharp
  - vb
  name: IsPossibleNumberForTypeWithReason(PhoneNumber, PhoneNumberType)
  nameWithType: PhoneNumberUtil.IsPossibleNumberForTypeWithReason(PhoneNumber, PhoneNumberType)
  fullName: PhoneNumbers.PhoneNumberUtil.IsPossibleNumberForTypeWithReason(PhoneNumbers.PhoneNumber, PhoneNumbers.PhoneNumberType)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Check whether a phone number is a possible number of a particular type. For types that don't

    exist in a particular region, this will return a result that isn't so useful; it is recommended

    that you use <xref href="PhoneNumbers.PhoneNumberUtil.GetSupportedTypesForRegion(System.String)" data-throw-if-not-resolved="false"></xref> or <xref href="PhoneNumbers.PhoneNumberUtil.GetSupportedTypesForNonGeoEntity(System.Int32)" data-throw-if-not-resolved="false"></xref>

    respectively before calling this method to determine whether you should call it for this number

    at all.


    This provides a more lenient check than <xref href="PhoneNumbers.PhoneNumberUtil.IsValidNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref> in the following sense:


    <ol>
      <li> It only checks the length of phone numbers. In particular, it doesn't check starting
           digits of the number.</li>
      <li> For some numbers (particularly fixed-line), many regions have the concept of area code,
           which together with subscriber number constitute the national significant number. It is
           sometimes okay to dial only the subscriber number when dialing in the same area. This
           function will return IS_POSSIBLE_LOCAL_ONLY if the subscriber-number-only version is
           passed in. On the other hand, because isValidNumber validates using information on both
           starting digits (for fixed line numbers, that would most likely be area codes) and
           length (obviously includes the length of area codes for fixed line numbers), it will
           return false for the subscriber-number-only version.</li>
    </ol>
  example: []
  syntax:
    content: public PhoneNumberUtil.ValidationResult IsPossibleNumberForTypeWithReason(PhoneNumber number, PhoneNumberType type)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the number that needs to be checked
    - id: type
      type: PhoneNumbers.PhoneNumberType
      description: the type we are interested in
    return:
      type: PhoneNumbers.PhoneNumberUtil.ValidationResult
      description: A ValidationResult object which indicates whether the number is possible
    content.vb: Public Function IsPossibleNumberForTypeWithReason(number As PhoneNumber, type As PhoneNumberType) As PhoneNumberUtil.ValidationResult
  overload: PhoneNumbers.PhoneNumberUtil.IsPossibleNumberForTypeWithReason*
- uid: PhoneNumbers.PhoneNumberUtil.IsPossibleNumber(System.String,System.String)
  commentId: M:PhoneNumbers.PhoneNumberUtil.IsPossibleNumber(System.String,System.String)
  id: IsPossibleNumber(System.String,System.String)
  parent: PhoneNumbers.PhoneNumberUtil
  langs:
  - csharp
  - vb
  name: IsPossibleNumber(string, string)
  nameWithType: PhoneNumberUtil.IsPossibleNumber(string, string)
  fullName: PhoneNumbers.PhoneNumberUtil.IsPossibleNumber(string, string)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Check whether a phone number is a possible number given a number in the form of a string, and

    the region where the number could be dialed from. It provides a more lenient check than

    <xref href="PhoneNumbers.PhoneNumberUtil.IsValidNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref>. See <xref href="PhoneNumbers.PhoneNumberUtil.IsPossibleNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref> for details.


    <p>

    This method first parses the number, then invokes <xref href="PhoneNumbers.PhoneNumberUtil.IsPossibleNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref>

    with the resultant PhoneNumber object.</p>
  example: []
  syntax:
    content: public bool IsPossibleNumber(string number, string regionDialingFrom)
    parameters:
    - id: number
      type: System.String
      description: The number that needs to be checked, in the form of a string.
    - id: regionDialingFrom
      type: System.String
      description: >-
        The region that we are expecting the number to be dialed from.
            Note this is different from the region where the number belongs.  For example, the number
            +1 650 253 0000 is a number that belongs to US. When written in this form, it can be
            dialed from any region. When it is written as 00 1 650 253 0000, it can be dialed from any
            region which uses an international dialling prefix of 00. When it is written as
            650 253 0000, it can only be dialed from within the US, and when written as 253 0000, it
            can only be dialed from within a smaller area in the US (Mountain View, CA, to be more
            specific).
    return:
      type: System.Boolean
      description: True if the number is possible.
    content.vb: Public Function IsPossibleNumber(number As String, regionDialingFrom As String) As Boolean
  overload: PhoneNumbers.PhoneNumberUtil.IsPossibleNumber*
  nameWithType.vb: PhoneNumberUtil.IsPossibleNumber(String, String)
  fullName.vb: PhoneNumbers.PhoneNumberUtil.IsPossibleNumber(String, String)
  name.vb: IsPossibleNumber(String, String)
