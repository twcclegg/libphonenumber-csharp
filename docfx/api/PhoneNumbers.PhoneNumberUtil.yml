- uid: PhoneNumbers.PhoneNumberUtil.IsNumberMatch(PhoneNumbers.PhoneNumber,PhoneNumbers.PhoneNumber)
  commentId: M:PhoneNumbers.PhoneNumberUtil.IsNumberMatch(PhoneNumbers.PhoneNumber,PhoneNumbers.PhoneNumber)
  id: IsNumberMatch(PhoneNumbers.PhoneNumber,PhoneNumbers.PhoneNumber)
  parent: PhoneNumbers.PhoneNumberUtil
  langs:
  - csharp
  - vb
  name: IsNumberMatch(PhoneNumber, PhoneNumber)
  nameWithType: PhoneNumberUtil.IsNumberMatch(PhoneNumber, PhoneNumber)
  fullName: PhoneNumbers.PhoneNumberUtil.IsNumberMatch(PhoneNumbers.PhoneNumber, PhoneNumbers.PhoneNumber)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Takes two phone numbers and compares them for equality.


    <p>

    Returns EXACT_MATCH if the country_code, NSN, presence of a leading zero for Italian numbers

    and any extension present are the same.

    Returns NSN_MATCH if either or both has no region specified, and the NSNs and extensions are

    the same.</p>

    <p>Returns SHORT_NSN_MATCH if either or both has no region specified, or the region specified is

    the same, and one NSN could be a shorter version of the other number. This includes the case

    where one has an extension specified, and the other does not.</p>

    <p>Returns NO_MATCH otherwise.

    For example, the numbers +1 345 657 1234 and 657 1234 are a SHORT_NSN_MATCH.

    The numbers +1 345 657 1234 and 345 657 are a NO_MATCH.</p>
  example: []
  syntax:
    content: public PhoneNumberUtil.MatchType IsNumberMatch(PhoneNumber firstNumberIn, PhoneNumber secondNumberIn)
    parameters:
    - id: firstNumberIn
      type: PhoneNumbers.PhoneNumber
      description: First number to compare.
    - id: secondNumberIn
      type: PhoneNumbers.PhoneNumber
      description: Second number to compare.
    return:
      type: PhoneNumbers.PhoneNumberUtil.MatchType
      description: >-
        NO_MATCH, SHORT_NSN_MATCH, NSN_MATCH or EXACT_MATCH depending on the level of equality
             of the two numbers, described in the method definition.
    content.vb: Public Function IsNumberMatch(firstNumberIn As PhoneNumber, secondNumberIn As PhoneNumber) As PhoneNumberUtil.MatchType
  overload: PhoneNumbers.PhoneNumberUtil.IsNumberMatch*
- uid: PhoneNumbers.PhoneNumberUtil.IsNumberMatch(System.String,System.String)
