  fullName: PhoneNumbers.PhoneNumberUtil.FormatInOriginalFormat(PhoneNumbers.PhoneNumber, string)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Formats a phone number using the original phone number format (e.g. INTERNATIONAL or NATIONAL)

    that the number is parsed from, provided that the number has been parsed with <xref href="PhoneNumbers.PhoneNumberUtil.ParseAndKeepRawInput(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref>.

    Otherwise the number will be formatted in NATIONAL format.The original format is embedded in the

    country_code_source field of the PhoneNumber object passed in, which is only set when parsing keeps the

    raw input. When we don't have a formatting pattern for the number, the method falls back to returning

    the raw input.


    Note this method guarantees no digit will be inserted, removed or modified as a result of formatting.
  example: []
  syntax:
    content: public string FormatInOriginalFormat(PhoneNumber number, string regionCallingFrom)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: The phone number that needs to be formatted in its original number format.
    - id: regionCallingFrom
      type: System.String
      description: >-
        The region whose IDD needs to be prefixed if the original number
             has one.
    return:
      type: System.String
      description: The formatted phone number in its original number format.
    content.vb: Public Function FormatInOriginalFormat(number As PhoneNumber, regionCallingFrom As String) As String
