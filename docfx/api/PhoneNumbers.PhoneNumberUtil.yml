- uid: PhoneNumbers.PhoneNumberUtil.GetSupportedGlobalNetworkCallingCodes
  commentId: M:PhoneNumbers.PhoneNumberUtil.GetSupportedGlobalNetworkCallingCodes
  id: GetSupportedGlobalNetworkCallingCodes
  parent: PhoneNumbers.PhoneNumberUtil
  langs:
  - csharp
  - vb
  name: GetSupportedGlobalNetworkCallingCodes()
  nameWithType: PhoneNumberUtil.GetSupportedGlobalNetworkCallingCodes()
  fullName: PhoneNumbers.PhoneNumberUtil.GetSupportedGlobalNetworkCallingCodes()
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: Returns all global network calling codes the library has metadata for.
  remarks: >-
    The semantics match Java's <code>getSupportedGlobalNetworkCallingCodes()</code>: only

    calling codes that map exclusively to non-geographical entities. The pre-binary-metadata

    implementation incidentally returned every loaded calling code (geographical too)

    because it leaked an internal dictionary populated by the eager XML loader; that was a

    bug — the docstring always promised "non-geographical entity" only.
  example: []
  syntax:
    content: public Dictionary<int, PhoneMetadata>.KeyCollection GetSupportedGlobalNetworkCallingCodes()
    return:
      type: System.Collections.Generic.Dictionary{System.Int32,PhoneNumbers.PhoneMetadata}.KeyCollection
      description: >-
        An unordered set of the country calling codes for every non-geographical entity the
            library supports (e.g. 800, 808, 870 for international toll-free / shared-cost / etc.).
    content.vb: Public Function GetSupportedGlobalNetworkCallingCodes() As Dictionary(Of Integer, PhoneMetadata).KeyCollection
  overload: PhoneNumbers.PhoneNumberUtil.GetSupportedGlobalNetworkCallingCodes*
