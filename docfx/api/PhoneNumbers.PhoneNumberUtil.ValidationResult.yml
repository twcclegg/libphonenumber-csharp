- uid: PhoneNumbers.PhoneNumberUtil.ValidationResult.INVALID_LENGTH
  commentId: F:PhoneNumbers.PhoneNumberUtil.ValidationResult.INVALID_LENGTH
  id: INVALID_LENGTH
  parent: PhoneNumbers.PhoneNumberUtil.ValidationResult
  langs:
  - csharp
  - vb
  name: INVALID_LENGTH
  nameWithType: PhoneNumberUtil.ValidationResult.INVALID_LENGTH
  fullName: PhoneNumbers.PhoneNumberUtil.ValidationResult.INVALID_LENGTH
  type: Field
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    The number is longer than the shortest valid numbers for this region, shorter than the

    longest valid numbers for this region, and does not itself have a number length that matches

    valid numbers for this region. This can also be returned in the case where

    isPossibleNumberForTypeWithReason was called, and there are no numbers of this type at all

    for this region.
  example: []
  syntax:
    content: INVALID_LENGTH = 4
    return:
      type: PhoneNumbers.PhoneNumberUtil.ValidationResult
