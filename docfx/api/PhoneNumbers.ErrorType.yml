- uid: PhoneNumbers.ErrorType.NOT_A_NUMBER
  commentId: F:PhoneNumbers.ErrorType.NOT_A_NUMBER
  id: NOT_A_NUMBER
  parent: PhoneNumbers.ErrorType
  langs:
  - csharp
  - vb
  name: NOT_A_NUMBER
  nameWithType: ErrorType.NOT_A_NUMBER
  fullName: PhoneNumbers.ErrorType.NOT_A_NUMBER
  type: Field
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    This indicates the string passed is not a valid number. Either the string had less than 3

    digits in it or had an invalid phone-context parameter. More specifically, the number failed

    to match the regular expression VALID_PHONE_NUMBER, RFC3966_GLOBAL_NUMBER_DIGITS, or

    RFC3966_DOMAINNAME in PhoneNumberUtil.cs.
  example: []
  syntax:
    content: NOT_A_NUMBER = 1
    return:
      type: PhoneNumbers.ErrorType
