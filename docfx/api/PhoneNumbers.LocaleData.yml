  - vb
  name: LocaleData
  nameWithType: LocaleData
  fullName: PhoneNumbers.LocaleData
  type: Class
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Holds a map from ISO 3166-1 country code (e.g. GB) to a dict. Each dict maps from an

    ISO 639-1 language code (e.g. ja) to the country's name in that language.
  remarks: >-
    The data lives in per-country binary resources built from

    <code>resources/locale/country_names.txt</code>. Reading <xref href="PhoneNumbers.LocaleData.Data" data-throw-if-not-resolved="false"></xref> materialises every

    country at once, so nothing inside this library uses it: the country-name lookup goes

    through <xref href="PhoneNumbers.LocaleNames" data-throw-if-not-resolved="false"></xref>, which reads one country. This type stays for callers

    outside the library that were using it before the data moved.
  example: []
  syntax:
    content: public class LocaleData
    content.vb: Public Class LocaleData
  inheritance:
