  langs:
  - csharp
  - vb
  name: PhoneNumberJsonContext
  nameWithType: PhoneNumberJsonContext
  fullName: PhoneNumbers.Extensions.PhoneNumberJsonContext
  type: Class
  assemblies:
  - PhoneNumbers.Extensions
  namespace: PhoneNumbers.Extensions
  summary: >-
    Source-generated <xref href="System.Text.Json.Serialization.JsonSerializerContext" data-throw-if-not-resolved="false"></xref> for <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref>,

    so consumers building trimmed or Native AOT apps do not need to hand-write one.
  remarks: >-
    <p>

    The metadata this context generates for <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref> is a plain,

    member-based (reflection-free) serializer — it knows nothing about

    <xref href="PhoneNumbers.Extensions.PhoneNumberConverter" data-throw-if-not-resolved="false"></xref>. Do not use it to actually serialize a

    <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref>: <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref>.DefaultInstanceForType is a

    public get-only property that returns the type's static default instance, which is itself a

    <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref> exposing the same DefaultInstanceForType property, so

    member-based serialization walks straight into infinite recursion (a

    <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> for exceeding the writer's max depth, or a real

    stack overflow at larger depth limits) instead of ever producing JSON. This context exists only

    so <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref> can be *resolved*

    (given a <xref href="System.Text.Json.Serialization.Metadata.JsonTypeInfo" data-throw-if-not-resolved="false"></xref> to satisfy the type

    graph) when it appears as a member of another type covered by source generation — e.g. a

    consumer's own <xref href="System.Text.Json.Serialization.JsonSerializerContext" data-throw-if-not-resolved="false"></xref> combined with this one via

    <xref href="System.Text.Json.Serialization.Metadata.JsonTypeInfoResolver" data-throw-if-not-resolved="false"></xref>.Combine — provided a converter is also registered so that

    resolved-but-broken metadata is never actually invoked.

    </p>

    <p>

    <b>Actual serialization always goes through <xref href="PhoneNumbers.Extensions.PhoneNumberConverter" data-throw-if-not-resolved="false"></xref>, never through

    the metadata generated here.</b> Prefer <xref href="PhoneNumbers.Extensions.PhoneNumberJsonOptions.Default" data-throw-if-not-resolved="false"></xref> (or

    <xref href="PhoneNumbers.Extensions.PhoneNumberJsonOptions.Create(System.Text.Json.JsonSerializerOptions)" data-throw-if-not-resolved="false"></xref>), which wires both together correctly. If you build

    your own <xref href="System.Text.Json.JsonSerializerOptions" data-throw-if-not-resolved="false"></xref> instead, you must set both:


    <pre><code class="lang-csharp">options.TypeInfoResolver = PhoneNumberJsonContext.Default;

    options.Converters.Add(new PhoneNumberConverter());</code></pre>


    and always serialize via <code>JsonSerializer.Serialize(value, options)</code> /

    <code>JsonSerializer.Deserialize(json, typeof(T), options)</code> — never via the raw

    <code>PhoneNumberJsonContext.Default.PhoneNumber</code> <xref href="System.Text.Json.Serialization.Metadata.JsonTypeInfo%601" data-throw-if-not-resolved="false"></xref> directly. That

    overload uses the <xref href="System.Text.Json.Serialization.Metadata.JsonTypeInfo%601" data-throw-if-not-resolved="false"></xref>'s own baked-in (member-based) converter and

    bypasses <xref href="System.Text.Json.JsonSerializerOptions.Converters" data-throw-if-not-resolved="false"></xref> entirely, hitting the recursion above.

    </p>
  example: []
  syntax:
    content: >-
      [JsonSourceGenerationOptions]

      [JsonSerializable(typeof(PhoneNumber))]

      public class PhoneNumberJsonContext : JsonSerializerContext, IJsonTypeInfoResolver
    content.vb: >-
      <JsonSourceGenerationOptions>

      <JsonSerializable(GetType(PhoneNumber))>

      Public Class PhoneNumberJsonContext Inherits JsonSerializerContext Implements IJsonTypeInfoResolver
