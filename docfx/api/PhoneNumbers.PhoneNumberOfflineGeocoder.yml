        a text description for the given language code for the given phone number, or empty
            string if the number passed in is invalid or could belong to multiple countries
    content.vb: Public Function GetDescriptionForNumber(number As PhoneNumber, languageCode As Locale) As String
  overload: PhoneNumbers.PhoneNumberOfflineGeocoder.GetDescriptionForNumber*
