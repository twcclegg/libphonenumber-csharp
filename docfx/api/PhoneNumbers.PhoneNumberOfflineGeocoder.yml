- uid: PhoneNumbers.PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  commentId: M:PhoneNumbers.PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  id: GetDescriptionForValidNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  parent: PhoneNumbers.PhoneNumberOfflineGeocoder
  langs:
  - csharp
  - vb
  name: GetDescriptionForValidNumber(PhoneNumber, Locale)
  nameWithType: PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber(PhoneNumber, Locale)
  fullName: PhoneNumbers.PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber(PhoneNumbers.PhoneNumber, PhoneNumbers.Locale)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Returns a text description for the given phone number, in the language provided. The

    description might consist of the name of the country where the phone number is from, or the

    name of the geographical area the phone number is from if more detailed information is

    available.


    <p>This method assumes the validity of the number passed in has already been checked, and that

    the number is suitable for geocoding. We consider fixed-line and mobile numbers possible

    candidates for geocoding.</p>
  example: []
  syntax:
    content: public string GetDescriptionForValidNumber(PhoneNumber number, Locale languageCode)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: a valid phone number for which we want to get a text description
    - id: languageCode
      type: PhoneNumbers.Locale
      description: the language code for which the description should be written
    return:
      type: System.String
      description: >-
        a text description for the given language code for the given phone number, or an
            empty string if the number could come from multiple countries, or the country code is in fact invalid
    content.vb: Public Function GetDescriptionForValidNumber(number As PhoneNumber, languageCode As Locale) As String
  overload: PhoneNumbers.PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber*
- uid: PhoneNumbers.PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale,System.String)
  commentId: M:PhoneNumbers.PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale,System.String)
  id: GetDescriptionForValidNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale,System.String)
  parent: PhoneNumbers.PhoneNumberOfflineGeocoder
  langs:
  - csharp
  - vb
  name: GetDescriptionForValidNumber(PhoneNumber, Locale, string)
  nameWithType: PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber(PhoneNumber, Locale, string)
  fullName: PhoneNumbers.PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber(PhoneNumbers.PhoneNumber, PhoneNumbers.Locale, string)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    As per <xref href="PhoneNumbers.PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber(PhoneNumbers.PhoneNumber%2cPhoneNumbers.Locale)" data-throw-if-not-resolved="false"></xref> but also considers the

    region of the user. If the phone number is from the same region as the user, only a lower-level

    description will be returned, if one exists. Otherwise, the phone number's region will be

    returned, with optionally some more detailed information.


    <p>For example, for a user from the region "US" (United States), we would show "Mountain View,

    CA" for a particular number, omitting the United States from the description. For a user from

    the United Kingdom (region "GB"), for the same number we may show "Mountain View, CA, United

    States" or even just "United States".</p>


    This method assumes the validity of the number passed in has already been checked.
  example: []
  syntax:
    content: public string GetDescriptionForValidNumber(PhoneNumber number, Locale languageCode, string userRegion)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the phone number for which we want to get a text description
    - id: languageCode
      type: PhoneNumbers.Locale
      description: the language code for which the description should be written
    - id: userRegion
      type: System.String
      description: the region code for a given user. This region will be omitted from the description if the phone number comes from this region. It should be a two-letter upper-case CLDR region code.
    return:
      type: System.String
      description: >-
        a text description for the given language code for the given phone number, or an
             empty string if the number could come from multiple countries, or the country code is in fact invalid
    content.vb: Public Function GetDescriptionForValidNumber(number As PhoneNumber, languageCode As Locale, userRegion As String) As String
  overload: PhoneNumbers.PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber*
  nameWithType.vb: PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber(PhoneNumber, Locale, String)
  fullName.vb: PhoneNumbers.PhoneNumberOfflineGeocoder.GetDescriptionForValidNumber(PhoneNumbers.PhoneNumber, PhoneNumbers.Locale, String)
  name.vb: GetDescriptionForValidNumber(PhoneNumber, Locale, String)
