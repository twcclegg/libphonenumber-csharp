      type: PhoneNumbers.Locale
      description: specifies the language of the data file to load
    - id: countryCallingCode
      type: System.Int32
      description: specifies the country calling code of phone numbers that are contained by the file to be loaded
    content.vb: Public Sub LoadDataFile(locale As Locale, countryCallingCode As Integer)
