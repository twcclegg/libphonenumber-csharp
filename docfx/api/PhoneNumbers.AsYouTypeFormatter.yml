  name: AsYouTypeFormatter
  nameWithType: AsYouTypeFormatter
  fullName: PhoneNumbers.AsYouTypeFormatter
  type: Class
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    A formatter which formats phone numbers as they are entered.


    <p>

    An AsYouTypeFormatter can be created by invoking

    <xref href="PhoneNumbers.PhoneNumberUtil.GetAsYouTypeFormatter(System.String)" data-throw-if-not-resolved="false"></xref>. After that, digits can be added by invoking

    <xref href="PhoneNumbers.AsYouTypeFormatter.InputDigit(System.Char)" data-throw-if-not-resolved="false"></xref> on the formatter instance, and the partially formatted phone number will be

    returned each time a digit is added. {@link #clear} can be invoked before formatting a new

    number.

    </p>


    See the unittests for more details on how the formatter is to be used.

    <!-- @author Shaopeng Jia -->
