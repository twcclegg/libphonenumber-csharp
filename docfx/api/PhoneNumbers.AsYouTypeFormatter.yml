  fullName.vb: PhoneNumbers.AsYouTypeFormatter.InputDigit(Char)
  name.vb: InputDigit(Char)
- uid: PhoneNumbers.AsYouTypeFormatter.InputDigitAndRememberPosition(System.Char)
  commentId: M:PhoneNumbers.AsYouTypeFormatter.InputDigitAndRememberPosition(System.Char)
  id: InputDigitAndRememberPosition(System.Char)
  parent: PhoneNumbers.AsYouTypeFormatter
  langs:
  - csharp
  - vb
  name: InputDigitAndRememberPosition(char)
  nameWithType: AsYouTypeFormatter.InputDigitAndRememberPosition(char)
  fullName: PhoneNumbers.AsYouTypeFormatter.InputDigitAndRememberPosition(char)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Same as <xref href="PhoneNumbers.AsYouTypeFormatter.InputDigit(System.Char)" data-throw-if-not-resolved="false"></xref>, but remembers the position where nextChar is inserted, so

    that it can be retrieved later by using <xref href="PhoneNumbers.AsYouTypeFormatter.GetRememberedPosition" data-throw-if-not-resolved="false"></xref>. The remembered

    position will be automatically adjusted if additional formatting characters are later

    inserted/removed in front of nextChar.
  example: []
  syntax:
    content: public string InputDigitAndRememberPosition(char nextChar)
    parameters:
    - id: nextChar
      type: System.Char
      description: ''
    return:
      type: System.String
      description: ''
    content.vb: Public Function InputDigitAndRememberPosition(nextChar As Char) As String
  overload: PhoneNumbers.AsYouTypeFormatter.InputDigitAndRememberPosition*
  nameWithType.vb: AsYouTypeFormatter.InputDigitAndRememberPosition(Char)
  fullName.vb: PhoneNumbers.AsYouTypeFormatter.InputDigitAndRememberPosition(Char)
  name.vb: InputDigitAndRememberPosition(Char)
