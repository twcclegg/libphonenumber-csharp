- uid: PhoneNumbers.AsYouTypeFormatter.InputDigit(System.Char)
  commentId: M:PhoneNumbers.AsYouTypeFormatter.InputDigit(System.Char)
  id: InputDigit(System.Char)
  parent: PhoneNumbers.AsYouTypeFormatter
  langs:
  - csharp
  - vb
  name: InputDigit(char)
  nameWithType: AsYouTypeFormatter.InputDigit(char)
  fullName: PhoneNumbers.AsYouTypeFormatter.InputDigit(char)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: Formats a phone number on-the-fly as each digit is entered.
  example: []
  syntax:
    content: public string InputDigit(char nextChar)
    parameters:
    - id: nextChar
      type: System.Char
      description: >-
        The most recently entered digit of a phone number. Formatting characters are
            allowed, but as soon as they are encountered this method formats the number as entered and
            not "as you type" anymore. Full width digits and Arabic-indic digits are allowed, and will
            be shown as they are.
    return:
      type: System.String
      description: The partially formatted phone number.
    content.vb: Public Function InputDigit(nextChar As Char) As String
  overload: PhoneNumbers.AsYouTypeFormatter.InputDigit*
