  commentId: T:PhoneNumbers.PhoneNumberUtil.Leniency
  id: PhoneNumberUtil.Leniency
  parent: PhoneNumbers
  children:
  - PhoneNumbers.PhoneNumberUtil.Leniency.EXACT_GROUPING
  - PhoneNumbers.PhoneNumberUtil.Leniency.POSSIBLE
  - PhoneNumbers.PhoneNumberUtil.Leniency.STRICT_GROUPING
  - PhoneNumbers.PhoneNumberUtil.Leniency.VALID
  langs:
  - csharp
  - vb
  name: PhoneNumberUtil.Leniency
  nameWithType: PhoneNumberUtil.Leniency
  fullName: PhoneNumbers.PhoneNumberUtil.Leniency
  type: Enum
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Leniency when <xref href="PhoneNumbers.PhoneNumberUtil.FindNumbers(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref> finding potential phone numbers in text

    segments. The levels here are ordered in increasing strictness.
  example: []
  syntax:
    content: public enum PhoneNumberUtil.Leniency
    content.vb: Public Enum PhoneNumberUtil.Leniency
  extensionMethods:
  - PhoneNumbers.PhoneNumberUtil.Leniency.PhoneNumbers.LeniencyExtensions.Verify(PhoneNumbers.PhoneNumber,System.String,PhoneNumbers.PhoneNumberUtil,PhoneNumbers.PhoneNumberMatcher)
- uid: PhoneNumbers.PhoneNumberUtil.Leniency.POSSIBLE
  commentId: F:PhoneNumbers.PhoneNumberUtil.Leniency.POSSIBLE
  id: POSSIBLE
  parent: PhoneNumbers.PhoneNumberUtil.Leniency
  langs:
  - csharp
  - vb
  name: POSSIBLE
  nameWithType: PhoneNumberUtil.Leniency.POSSIBLE
  fullName: PhoneNumbers.PhoneNumberUtil.Leniency.POSSIBLE
  type: Field
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Phone numbers accepted are <xref href="PhoneNumbers.PhoneNumberUtil.IsPossibleNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref>

    possible, but not necessarily <xref href="PhoneNumbers.PhoneNumberUtil.IsValidNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref> valid.
  example: []
  syntax:
    content: POSSIBLE = 0
    return:
      type: PhoneNumbers.PhoneNumberUtil.Leniency
- uid: PhoneNumbers.PhoneNumberUtil.Leniency.VALID
  commentId: F:PhoneNumbers.PhoneNumberUtil.Leniency.VALID
  id: VALID
  parent: PhoneNumbers.PhoneNumberUtil.Leniency
  langs:
  - csharp
  - vb
  name: VALID
  nameWithType: PhoneNumberUtil.Leniency.VALID
  fullName: PhoneNumbers.PhoneNumberUtil.Leniency.VALID
  type: Field
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Phone numbers accepted are <xref href="PhoneNumbers.PhoneNumberUtil.IsPossibleNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref>

    possible and <xref href="PhoneNumbers.PhoneNumberUtil.IsValidNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref> valid. Numbers written

    in national format must have their national-prefix present if it is usually written for a

    number of this type.
  example: []
  syntax:
    content: VALID = 1
    return:
      type: PhoneNumbers.PhoneNumberUtil.Leniency
- uid: PhoneNumbers.PhoneNumberUtil.Leniency.STRICT_GROUPING
  commentId: F:PhoneNumbers.PhoneNumberUtil.Leniency.STRICT_GROUPING
  id: STRICT_GROUPING
  parent: PhoneNumbers.PhoneNumberUtil.Leniency
  langs:
  - csharp
  - vb
  name: STRICT_GROUPING
  nameWithType: PhoneNumberUtil.Leniency.STRICT_GROUPING
  fullName: PhoneNumbers.PhoneNumberUtil.Leniency.STRICT_GROUPING
  type: Field
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Phone numbers accepted are <xref href="PhoneNumbers.PhoneNumberUtil.IsValidNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref> valid and

    are grouped in a possible way for this locale. For example, a US number written as

    "65 02 53 00 00" and "650253 0000" are not accepted at this leniency level, whereas

    "650 253 0000", "650 2530000" or "6502530000" are.

    Numbers with more than one '/' symbol are also dropped at this level.


    <p>

    Warning: This level might result in lower coverage especially for regions outside of country

    code "+1". If you are not sure about which level to use, email the discussion group

    libphonenumber-discuss@googlegroups.com.

    </p>
  example: []
  syntax:
    content: STRICT_GROUPING = 2
    return:
      type: PhoneNumbers.PhoneNumberUtil.Leniency
- uid: PhoneNumbers.PhoneNumberUtil.Leniency.EXACT_GROUPING
  commentId: F:PhoneNumbers.PhoneNumberUtil.Leniency.EXACT_GROUPING
  id: EXACT_GROUPING
  parent: PhoneNumbers.PhoneNumberUtil.Leniency
  langs:
  - csharp
  - vb
  name: EXACT_GROUPING
  nameWithType: PhoneNumberUtil.Leniency.EXACT_GROUPING
  fullName: PhoneNumbers.PhoneNumberUtil.Leniency.EXACT_GROUPING
  type: Field
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Phone numbers accepted are <xref href="PhoneNumbers.PhoneNumberUtil.IsValidNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref> valid and

    are grouped in the same way that we would have formatted it, or as a single block. For

    example, a US number written as "650 2530000" is not accepted at this leniency level, whereas

    "650 253 0000" or "6502530000" are.

    Numbers with more than one '/' symbol are also dropped at this level.


    <p>

    Warning: This level might result in lower coverage especially for regions outside of country

    code "+1". If you are not sure about which level to use, email the discussion group

    libphonenumber-discuss@googlegroups.com.

    </p>
  example: []
  syntax:
    content: EXACT_GROUPING = 3
    return:
      type: PhoneNumbers.PhoneNumberUtil.Leniency
