- uid: PhoneNumbers.ShortNumberInfo.IsPossibleShortNumber(PhoneNumbers.PhoneNumber)
  commentId: M:PhoneNumbers.ShortNumberInfo.IsPossibleShortNumber(PhoneNumbers.PhoneNumber)
  id: IsPossibleShortNumber(PhoneNumbers.PhoneNumber)
  parent: PhoneNumbers.ShortNumberInfo
  langs:
  - csharp
