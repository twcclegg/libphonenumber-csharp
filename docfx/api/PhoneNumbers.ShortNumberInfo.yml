- uid: PhoneNumbers.ShortNumberInfo.GetExpectedCostForRegion(PhoneNumbers.PhoneNumber,System.String)
  commentId: M:PhoneNumbers.ShortNumberInfo.GetExpectedCostForRegion(PhoneNumbers.PhoneNumber,System.String)
  id: GetExpectedCostForRegion(PhoneNumbers.PhoneNumber,System.String)
  parent: PhoneNumbers.ShortNumberInfo
  langs:
  - csharp
  - vb
  name: GetExpectedCostForRegion(PhoneNumber, string)
  nameWithType: ShortNumberInfo.GetExpectedCostForRegion(PhoneNumber, string)
  fullName: PhoneNumbers.ShortNumberInfo.GetExpectedCostForRegion(PhoneNumbers.PhoneNumber, string)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Gets the expected cost category of a short number when dialed from a region (however, nothing

    is implied about its validity). If it is important that the number is valid, then its validity

    must first be checked using <xref href="PhoneNumbers.ShortNumberInfo.IsValidShortNumberForRegion(PhoneNumbers.PhoneNumber%2cSystem.String)" data-throw-if-not-resolved="false"></xref>. Note that emergency numbers

    are always considered toll-free. Example usage:


    <pre><code class="lang-csharp">// The region for which the number was parsed and the region we subsequently check against

    // need not be the same. Here we parse the number in the US and check it for Canada.

    PhoneNumber number = phoneUtil.parse("110", "US");

    ...

    string regionCode = "CA";

    ShortNumberInfo shortInfo = ShortNumberInfo.getInstance();

    if (shortInfo.isValidShortNumberForRegion(shortNumber, regionCode)) {
      ShortNumberCost cost = shortInfo.getExpectedCostForRegion(number, regionCode);
      // Do something with the cost information here.
    }}</code></pre>
  example: []
  syntax:
    content: public ShortNumberInfo.ShortNumberCost GetExpectedCostForRegion(PhoneNumber number, string regionDialingFrom)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the short number for which we want to know the expected cost category
    - id: regionDialingFrom
      type: System.String
      description: the region from which the number is dialed
    return:
      type: PhoneNumbers.ShortNumberInfo.ShortNumberCost
      description: >-
        the expected cost category for that region of the short number. Returns UNKNOWN_COST if
                the number does not match a cost category. Note that an invalid number may match any cost
                category.
    content.vb: Public Function GetExpectedCostForRegion(number As PhoneNumber, regionDialingFrom As String) As ShortNumberInfo.ShortNumberCost
  overload: PhoneNumbers.ShortNumberInfo.GetExpectedCostForRegion*
  nameWithType.vb: ShortNumberInfo.GetExpectedCostForRegion(PhoneNumber, String)
  fullName.vb: PhoneNumbers.ShortNumberInfo.GetExpectedCostForRegion(PhoneNumbers.PhoneNumber, String)
  name.vb: GetExpectedCostForRegion(PhoneNumber, String)
- uid: PhoneNumbers.ShortNumberInfo.GetExpectedCost(PhoneNumbers.PhoneNumber)
  commentId: M:PhoneNumbers.ShortNumberInfo.GetExpectedCost(PhoneNumbers.PhoneNumber)
  id: GetExpectedCost(PhoneNumbers.PhoneNumber)
  parent: PhoneNumbers.ShortNumberInfo
  langs:
  - csharp
  - vb
  name: GetExpectedCost(PhoneNumber)
  nameWithType: ShortNumberInfo.GetExpectedCost(PhoneNumber)
  fullName: PhoneNumbers.ShortNumberInfo.GetExpectedCost(PhoneNumbers.PhoneNumber)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Gets the expected cost category of a short number (however, nothing is implied about its

    validity). If the country calling code is unique to a region, this method behaves exactly the

    same as <xref href="PhoneNumbers.ShortNumberInfo.GetExpectedCostForRegion(PhoneNumbers.PhoneNumber%2cSystem.String)" data-throw-if-not-resolved="false"></xref>. However, if the country

    calling code is shared by multiple regions, then it returns the highest cost in the sequence

    PREMIUM_RATE, UNKNOWN_COST, STANDARD_RATE, TOLL_FREE. The reason for the position of

    UNKNOWN_COST in this order is that if a number is UNKNOWN_COST in one region but STANDARD_RATE

    or TOLL_FREE in another, its expected cost cannot be estimated as one of the latter since it

    might be a PREMIUM_RATE number.


    <p></p>


    For example, if a number is STANDARD_RATE in the US, but TOLL_FREE in Canada, the expected

    cost returned by this method will be STANDARD_RATE, since the NANPA countries share the same

    country calling code.


    <p></p>


    Note: If the region from which the number is dialed is known, it is highly preferable to call

    <xref href="PhoneNumbers.ShortNumberInfo.GetExpectedCostForRegion(PhoneNumbers.PhoneNumber%2cSystem.String)" data-throw-if-not-resolved="false"></xref> instead.
  example: []
  syntax:
    content: public ShortNumberInfo.ShortNumberCost GetExpectedCost(PhoneNumber number)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the short number for which we want to know the expected cost category
    return:
      type: PhoneNumbers.ShortNumberInfo.ShortNumberCost
      description: >-
        the highest expected cost category of the short number in the region(s) with the given
                country calling code
    content.vb: Public Function GetExpectedCost(number As PhoneNumber) As ShortNumberInfo.ShortNumberCost
  overload: PhoneNumbers.ShortNumberInfo.GetExpectedCost*
- uid: PhoneNumbers.ShortNumberInfo.ConnectsToEmergencyNumber(System.String,System.String)
  commentId: M:PhoneNumbers.ShortNumberInfo.ConnectsToEmergencyNumber(System.String,System.String)
  id: ConnectsToEmergencyNumber(System.String,System.String)
  parent: PhoneNumbers.ShortNumberInfo
  langs:
  - csharp
  - vb
  name: ConnectsToEmergencyNumber(string, string)
  nameWithType: ShortNumberInfo.ConnectsToEmergencyNumber(string, string)
  fullName: PhoneNumbers.ShortNumberInfo.ConnectsToEmergencyNumber(string, string)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Returns true if the given number, exactly as dialed, might be used to connect to an emergency

    service in the given region.


    <p></p>


    This method accepts a string, rather than a PhoneNumber, because it needs to distinguish

    cases such as "+1 911" and "911", where the former may not connect to an emergency service in

    all cases but the latter would. This method takes into account cases where the number might

    contain formatting, or might have additional digits appended (when it is okay to do that in

    the specified region).
  example: []
  syntax:
    content: public bool ConnectsToEmergencyNumber(string number, string regionCode)
    parameters:
    - id: number
      type: System.String
      description: the phone number to test
    - id: regionCode
      type: System.String
      description: the region where the phone number is being dialed
    return:
      type: System.Boolean
      description: whether the number might be used to connect to an emergency service in the given region
    content.vb: Public Function ConnectsToEmergencyNumber(number As String, regionCode As String) As Boolean
  overload: PhoneNumbers.ShortNumberInfo.ConnectsToEmergencyNumber*
  nameWithType.vb: ShortNumberInfo.ConnectsToEmergencyNumber(String, String)
  fullName.vb: PhoneNumbers.ShortNumberInfo.ConnectsToEmergencyNumber(String, String)
  name.vb: ConnectsToEmergencyNumber(String, String)
- uid: PhoneNumbers.ShortNumberInfo.IsEmergencyNumber(System.String,System.String)
  commentId: M:PhoneNumbers.ShortNumberInfo.IsEmergencyNumber(System.String,System.String)
  id: IsEmergencyNumber(System.String,System.String)
  parent: PhoneNumbers.ShortNumberInfo
  langs:
  - csharp
  - vb
  name: IsEmergencyNumber(string, string)
  nameWithType: ShortNumberInfo.IsEmergencyNumber(string, string)
  fullName: PhoneNumbers.ShortNumberInfo.IsEmergencyNumber(string, string)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Returns true if the given number exactly matches an emergency service number in the given

    region.


    <p></p>


    This method takes into account cases where the number might contain formatting, but doesn't

    allow additional digits to be appended. Note that <xref href="PhoneNumbers.ShortNumberInfo.IsEmergencyNumber(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref>

    implies <xref href="PhoneNumbers.ShortNumberInfo.ConnectsToEmergencyNumber(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public bool IsEmergencyNumber(string number, string regionCode)
    parameters:
    - id: number
      type: System.String
      description: the phone number to test
    - id: regionCode
      type: System.String
      description: the region where the phone number is being dialed
    return:
      type: System.Boolean
      description: whether the number exactly matches an emergency services number in the given region
    content.vb: Public Function IsEmergencyNumber(number As String, regionCode As String) As Boolean
  overload: PhoneNumbers.ShortNumberInfo.IsEmergencyNumber*
  nameWithType.vb: ShortNumberInfo.IsEmergencyNumber(String, String)
  fullName.vb: PhoneNumbers.ShortNumberInfo.IsEmergencyNumber(String, String)
  name.vb: IsEmergencyNumber(String, String)
- uid: PhoneNumbers.ShortNumberInfo.IsCarrierSpecific(PhoneNumbers.PhoneNumber)
  commentId: M:PhoneNumbers.ShortNumberInfo.IsCarrierSpecific(PhoneNumbers.PhoneNumber)
  id: IsCarrierSpecific(PhoneNumbers.PhoneNumber)
  parent: PhoneNumbers.ShortNumberInfo
  langs:
  - csharp
  - vb
  name: IsCarrierSpecific(PhoneNumber)
  nameWithType: ShortNumberInfo.IsCarrierSpecific(PhoneNumber)
  fullName: PhoneNumbers.ShortNumberInfo.IsCarrierSpecific(PhoneNumbers.PhoneNumber)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Given a valid short number, determines whether it is carrier-specific (however, nothing is

    implied about its validity). Carrier-specific numbers may connect to a different end-point, or

    not connect at all, depending on the user's carrier. If it is important that the number is

    valid, then its validity must first be checked using <xref href="PhoneNumbers.ShortNumberInfo.IsValidShortNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref> or

    <see cerf="IsValidShortNumberForRegion"></see>.
  example: []
  syntax:
    content: public bool IsCarrierSpecific(PhoneNumber number)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the valid short number to check
    return:
      type: System.Boolean
      description: >-
        whether the short number is carrier-specific, assuming the input was a valid short
                number
    content.vb: Public Function IsCarrierSpecific(number As PhoneNumber) As Boolean
  overload: PhoneNumbers.ShortNumberInfo.IsCarrierSpecific*
- uid: PhoneNumbers.ShortNumberInfo.IsCarrierSpecificForRegion(PhoneNumbers.PhoneNumber,System.String)
  commentId: M:PhoneNumbers.ShortNumberInfo.IsCarrierSpecificForRegion(PhoneNumbers.PhoneNumber,System.String)
  id: IsCarrierSpecificForRegion(PhoneNumbers.PhoneNumber,System.String)
  parent: PhoneNumbers.ShortNumberInfo
  langs:
  - csharp
  - vb
  name: IsCarrierSpecificForRegion(PhoneNumber, string)
  nameWithType: ShortNumberInfo.IsCarrierSpecificForRegion(PhoneNumber, string)
  fullName: PhoneNumbers.ShortNumberInfo.IsCarrierSpecificForRegion(PhoneNumbers.PhoneNumber, string)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Given a valid short number, determines whether it is carrier-specific when dialed from the

    given region (however, nothing is implied about its validity). Carrier-specific numbers may

    connect to a different end-point, or not connect at all, depending on the user's carrier. If

    it is important that the number is valid, then its validity must first be checked using

    <xref href="PhoneNumbers.ShortNumberInfo.IsValidShortNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref> or <xref href="PhoneNumbers.ShortNumberInfo.IsValidShortNumberForRegion(PhoneNumbers.PhoneNumber%2cSystem.String)" data-throw-if-not-resolved="false"></xref>.

    Returns false if the number doesn't match the region provided.
  example: []
  syntax:
    content: public bool IsCarrierSpecificForRegion(PhoneNumber number, string regionDialingFrom)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the valid short number to check
    - id: regionDialingFrom
      type: System.String
      description: the region from which the number is dialed
    return:
      type: System.Boolean
      description: >-
        whether the short number is carrier-specific in the provided region, assuming the
                 input was a valid short number
    content.vb: Public Function IsCarrierSpecificForRegion(number As PhoneNumber, regionDialingFrom As String) As Boolean
  overload: PhoneNumbers.ShortNumberInfo.IsCarrierSpecificForRegion*
  nameWithType.vb: ShortNumberInfo.IsCarrierSpecificForRegion(PhoneNumber, String)
  fullName.vb: PhoneNumbers.ShortNumberInfo.IsCarrierSpecificForRegion(PhoneNumbers.PhoneNumber, String)
  name.vb: IsCarrierSpecificForRegion(PhoneNumber, String)
- uid: PhoneNumbers.ShortNumberInfo.IsSmsServiceForRegion(PhoneNumbers.PhoneNumber,System.String)
  commentId: M:PhoneNumbers.ShortNumberInfo.IsSmsServiceForRegion(PhoneNumbers.PhoneNumber,System.String)
  id: IsSmsServiceForRegion(PhoneNumbers.PhoneNumber,System.String)
  parent: PhoneNumbers.ShortNumberInfo
  langs:
  - csharp
  - vb
  name: IsSmsServiceForRegion(PhoneNumber, string)
  nameWithType: ShortNumberInfo.IsSmsServiceForRegion(PhoneNumber, string)
  fullName: PhoneNumbers.ShortNumberInfo.IsSmsServiceForRegion(PhoneNumbers.PhoneNumber, string)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Given a valid short number, determines whether it is an SMS service (however, nothing is

    implied about its validity). An SMS service is where the primary or only intended usage is to

    receive and/or send text messages (SMSs). This includes MMS as MMS numbers downgrade to SMS if

    the other party isn't MMS-capable. If it is important that the number is valid, then its

    validity must first be checked using <xref href="PhoneNumbers.ShortNumberInfo.IsValidShortNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref> or

    <xref href="PhoneNumbers.ShortNumberInfo.IsValidShortNumberForRegion(PhoneNumbers.PhoneNumber%2cSystem.String)" data-throw-if-not-resolved="false"></xref>. Returns false if the number doesn't match the region provided.
  example: []
  syntax:
    content: public bool IsSmsServiceForRegion(PhoneNumber number, string regionDialingFrom)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the valid short number to check
    - id: regionDialingFrom
      type: System.String
      description: the region from which the number is dialed
    return:
      type: System.Boolean
      description: >-
        whether the short number is an SMS service in the provided region, assuming the input
               was a valid short number
    content.vb: Public Function IsSmsServiceForRegion(number As PhoneNumber, regionDialingFrom As String) As Boolean
  overload: PhoneNumbers.ShortNumberInfo.IsSmsServiceForRegion*
  nameWithType.vb: ShortNumberInfo.IsSmsServiceForRegion(PhoneNumber, String)
  fullName.vb: PhoneNumbers.ShortNumberInfo.IsSmsServiceForRegion(PhoneNumbers.PhoneNumber, String)
  name.vb: IsSmsServiceForRegion(PhoneNumber, String)
