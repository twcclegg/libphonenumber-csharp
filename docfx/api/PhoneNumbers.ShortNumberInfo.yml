  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Check whether a short number is a possible number. If a country calling code is shared by

    multiple regions, this returns true if it's possible in any of them. This provides a more

    lenient check than <xref href="PhoneNumbers.ShortNumberInfo.IsValidShortNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref>. See

    <xref href="PhoneNumbers.ShortNumberInfo.IsPossibleShortNumberForRegion(PhoneNumbers.PhoneNumber%2cSystem.String)" data-throw-if-not-resolved="false"></xref> for details.
  example: []
  syntax:
    content: public bool IsPossibleShortNumber(PhoneNumber number)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: the short number to check
    return:
      type: System.Boolean
      description: whether the number is a possible short number
    content.vb: Public Function IsPossibleShortNumber(number As PhoneNumber) As Boolean
  overload: PhoneNumbers.ShortNumberInfo.IsPossibleShortNumber*
