- uid: PhoneNumbers.PhoneNumberToCarrierMapper.GetNameForValidNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  commentId: M:PhoneNumbers.PhoneNumberToCarrierMapper.GetNameForValidNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  id: GetNameForValidNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  parent: PhoneNumbers.PhoneNumberToCarrierMapper
  langs:
  - csharp
  - vb
  name: GetNameForValidNumber(PhoneNumber, Locale)
  nameWithType: PhoneNumberToCarrierMapper.GetNameForValidNumber(PhoneNumber, Locale)
  fullName: PhoneNumbers.PhoneNumberToCarrierMapper.GetNameForValidNumber(PhoneNumbers.PhoneNumber, PhoneNumbers.Locale)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Returns a carrier name for the given phone number, in the language provided.


    <p>

    The carrier name is the one the number was originally allocated to. If the country supports

    mobile number portability the number might not belong to the returned carrier anymore.

    If no mapping is found an empty string is returned.

    </p>

    <p>

    This method assumes the validity of the number passed in has already been checked, and that

    the number is suitable for carrier lookup. We consider mobile and pager numbers possible

    candidates for carrier lookup.

    </p>
  example: []
  syntax:
    content: public string GetNameForValidNumber(PhoneNumber number, Locale languageCode)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: A valid phone number for which we want to get a carrier name.
    - id: languageCode
      type: PhoneNumbers.Locale
      description: The language code in which the name should be written.
    return:
      type: System.String
      description: A carrier name for the given phone number, or empty string if not found.
    content.vb: Public Function GetNameForValidNumber(number As PhoneNumber, languageCode As Locale) As String
  overload: PhoneNumbers.PhoneNumberToCarrierMapper.GetNameForValidNumber*
- uid: PhoneNumbers.PhoneNumberToCarrierMapper.GetNameForNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  commentId: M:PhoneNumbers.PhoneNumberToCarrierMapper.GetNameForNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  id: GetNameForNumber(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  parent: PhoneNumbers.PhoneNumberToCarrierMapper
  langs:
  - csharp
  - vb
  name: GetNameForNumber(PhoneNumber, Locale)
  nameWithType: PhoneNumberToCarrierMapper.GetNameForNumber(PhoneNumber, Locale)
  fullName: PhoneNumbers.PhoneNumberToCarrierMapper.GetNameForNumber(PhoneNumbers.PhoneNumber, PhoneNumbers.Locale)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Gets the name of the carrier for the given phone number, in the language provided.

    As per <xref href="PhoneNumbers.PhoneNumberToCarrierMapper.GetNameForValidNumber(PhoneNumbers.PhoneNumber%2cPhoneNumbers.Locale)" data-throw-if-not-resolved="false"></xref> but explicitly checks the validity of

    the number passed in, and returns empty string if the number is not a mobile or pager number.
  example: []
  syntax:
    content: public string GetNameForNumber(PhoneNumber number, Locale languageCode)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: The phone number for which we want to get a carrier name.
    - id: languageCode
      type: PhoneNumbers.Locale
      description: The language code in which the name should be written.
    return:
      type: System.String
      description: >-
        A carrier name for the given phone number, or empty string if the number passed
            in is invalid or is not a mobile/pager number.
    content.vb: Public Function GetNameForNumber(number As PhoneNumber, languageCode As Locale) As String
  overload: PhoneNumbers.PhoneNumberToCarrierMapper.GetNameForNumber*
- uid: PhoneNumbers.PhoneNumberToCarrierMapper.GetSafeDisplayName(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  commentId: M:PhoneNumbers.PhoneNumberToCarrierMapper.GetSafeDisplayName(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  id: GetSafeDisplayName(PhoneNumbers.PhoneNumber,PhoneNumbers.Locale)
  parent: PhoneNumbers.PhoneNumberToCarrierMapper
  langs:
  - csharp
  - vb
  name: GetSafeDisplayName(PhoneNumber, Locale)
  nameWithType: PhoneNumberToCarrierMapper.GetSafeDisplayName(PhoneNumber, Locale)
  fullName: PhoneNumbers.PhoneNumberToCarrierMapper.GetSafeDisplayName(PhoneNumbers.PhoneNumber, PhoneNumbers.Locale)
  type: Method
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Gets the name of the carrier for the given phone number only when it is 'safe' to display

    to users. A carrier name is considered safe if the number is valid and for a region that

    doesn't support mobile number portability.
  example: []
  syntax:
    content: public string GetSafeDisplayName(PhoneNumber number, Locale languageCode)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
      description: The phone number for which we want to get a carrier name.
    - id: languageCode
      type: PhoneNumbers.Locale
      description: The language code in which the name should be written.
    return:
      type: System.String
      description: A carrier name that is safe to display to users, or the empty string.
    content.vb: Public Function GetSafeDisplayName(number As PhoneNumber, languageCode As Locale) As String
  overload: PhoneNumbers.PhoneNumberToCarrierMapper.GetSafeDisplayName*
