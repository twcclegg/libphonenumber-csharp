  fullName: PhoneNumbers.PhoneNumberMatcher.PhoneNumberMatcher(PhoneNumbers.PhoneNumberUtil, string, string, PhoneNumbers.PhoneNumberUtil.Leniency, long)
  type: Constructor
  assemblies:
  - PhoneNumbers
  namespace: PhoneNumbers
  summary: >-
    Creates a new instance. See the factory methods in {@link PhoneNumberUtil} on how to obtain a

    new instance.
  example: []
  syntax:
    content: public PhoneNumberMatcher(PhoneNumberUtil util, string text, string country, PhoneNumberUtil.Leniency leniency, long maxTries)
    parameters:
    - id: util
      type: PhoneNumbers.PhoneNumberUtil
      description: the phone number util to use
    - id: text
      type: System.String
      description: the character sequence that we will search, null for no text
    - id: country
      type: System.String
      description: >-
        the country to assume for phone numbers not written in international format
                                   (with a leading plus, or with the international dialing prefix of the
                                   specified region). May be null or "ZZ" if only numbers with a
                                   leading plus should be considered.
    - id: leniency
      type: PhoneNumbers.PhoneNumberUtil.Leniency
      description: the leniency to use when evaluating candidate phone numbers
    - id: maxTries
      type: System.Int64
      description: >-
        the maximum number of invalid numbers to try before giving up on the text.
                                    This is to cover degenerate cases where the text has a lot of false positives
                                    in it. Must be <code> &gt;= 0</code>.
