  - vb
  name: PhoneNumberJsonOptions
  nameWithType: PhoneNumberJsonOptions
  fullName: PhoneNumbers.Extensions.PhoneNumberJsonOptions
  type: Class
  assemblies:
  - PhoneNumbers.Extensions
  namespace: PhoneNumbers.Extensions
  summary: >-
    Ready-made <xref href="System.Text.Json.JsonSerializerOptions" data-throw-if-not-resolved="false"></xref> for serializing <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref>

    under Native AOT / trimming, where the reflection-based default resolver is unavailable.

    Combines <xref href="PhoneNumbers.Extensions.PhoneNumberJsonContext" data-throw-if-not-resolved="false"></xref> (source-generated type metadata) with

    <xref href="PhoneNumbers.Extensions.PhoneNumberConverter" data-throw-if-not-resolved="false"></xref> (the actual read/write logic) so callers cannot wire the two

    together incorrectly — see the remarks on <xref href="PhoneNumbers.Extensions.PhoneNumberJsonContext" data-throw-if-not-resolved="false"></xref> for why doing it

    by hand is easy to get wrong.
  example: []
  syntax:
    content: public static class PhoneNumberJsonOptions
    content.vb: Public Module PhoneNumberJsonOptions
