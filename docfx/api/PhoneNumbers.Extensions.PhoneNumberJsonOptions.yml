- uid: PhoneNumbers.Extensions.PhoneNumberJsonOptions.Default
  commentId: P:PhoneNumbers.Extensions.PhoneNumberJsonOptions.Default
  id: Default
  parent: PhoneNumbers.Extensions.PhoneNumberJsonOptions
  langs:
  - csharp
  - vb
  name: Default
  nameWithType: PhoneNumberJsonOptions.Default
  fullName: PhoneNumbers.Extensions.PhoneNumberJsonOptions.Default
  type: Property
  assemblies:
  - PhoneNumbers.Extensions
  namespace: PhoneNumbers.Extensions
  summary: >-
    A shared, ready-to-use <xref href="System.Text.Json.JsonSerializerOptions" data-throw-if-not-resolved="false"></xref> instance for a bare

    <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref>, e.g.

    <code>JsonSerializer.Serialize(number, PhoneNumberJsonOptions.Default)</code>. Instances of

    <xref href="System.Text.Json.JsonSerializerOptions" data-throw-if-not-resolved="false"></xref> are safe to reuse concurrently once first used, so this

    is safe to share across a whole application.
  example: []
  syntax:
    content: public static JsonSerializerOptions Default { get; }
    parameters: []
    return:
      type: System.Text.Json.JsonSerializerOptions
    content.vb: Public Shared ReadOnly Property [Default] As JsonSerializerOptions
  overload: PhoneNumbers.Extensions.PhoneNumberJsonOptions.Default*
- uid: PhoneNumbers.Extensions.PhoneNumberJsonOptions.Create(System.Text.Json.JsonSerializerOptions)
  commentId: M:PhoneNumbers.Extensions.PhoneNumberJsonOptions.Create(System.Text.Json.JsonSerializerOptions)
  id: Create(System.Text.Json.JsonSerializerOptions)
  parent: PhoneNumbers.Extensions.PhoneNumberJsonOptions
  langs:
  - csharp
  - vb
  name: Create(JsonSerializerOptions)
  nameWithType: PhoneNumberJsonOptions.Create(JsonSerializerOptions)
  fullName: PhoneNumbers.Extensions.PhoneNumberJsonOptions.Create(System.Text.Json.JsonSerializerOptions)
  type: Method
  assemblies:
  - PhoneNumbers.Extensions
  namespace: PhoneNumbers.Extensions
  summary: >-
    Builds a new <xref href="System.Text.Json.JsonSerializerOptions" data-throw-if-not-resolved="false"></xref> with <xref href="PhoneNumbers.Extensions.PhoneNumberJsonContext" data-throw-if-not-resolved="false"></xref>

    and <xref href="PhoneNumbers.Extensions.PhoneNumberConverter" data-throw-if-not-resolved="false"></xref> wired together correctly. Use this instead of

    <xref href="PhoneNumbers.Extensions.PhoneNumberJsonOptions.Default" data-throw-if-not-resolved="false"></xref> when you need to layer in your own settings (e.g. combining

    <xref href="PhoneNumbers.Extensions.PhoneNumberJsonContext.Default" data-throw-if-not-resolved="false"></xref> with your own <xref href="System.Text.Json.Serialization.JsonSerializerContext" data-throw-if-not-resolved="false"></xref>

    via <xref href="System.Text.Json.Serialization.Metadata.JsonTypeInfoResolver" data-throw-if-not-resolved="false"></xref>.Combine for a

    DTO that has a <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref> property), or when you don't want to

    mutate the shared <xref href="PhoneNumbers.Extensions.PhoneNumberJsonOptions.Default" data-throw-if-not-resolved="false"></xref> instance.
  example: []
  syntax:
    content: public static JsonSerializerOptions Create(JsonSerializerOptions baseOptions = null)
    parameters:
    - id: baseOptions
      type: System.Text.Json.JsonSerializerOptions
      description: >-
        Optional options to copy other settings from (e.g. <xref href="System.Text.Json.JsonSerializerOptions.WriteIndented" data-throw-if-not-resolved="false"></xref>).

        If <code class="paramref">baseOptions</code> already has a <xref href="System.Text.Json.JsonSerializerOptions.TypeInfoResolver" data-throw-if-not-resolved="false"></xref>

        set (e.g. your own <xref href="System.Text.Json.Serialization.JsonSerializerContext" data-throw-if-not-resolved="false"></xref>, or a resolver already combined via

        <code>JsonTypeInfoResolver.Combine</code>), it is combined with

        <xref href="PhoneNumbers.Extensions.PhoneNumberJsonContext.Default" data-throw-if-not-resolved="false"></xref> rather than replaced, so a DTO type resolved by your

        own context can still contain a <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref> property. A

        <xref href="PhoneNumbers.Extensions.PhoneNumberConverter" data-throw-if-not-resolved="false"></xref> is always appended to <xref href="System.Text.Json.JsonSerializerOptions.Converters" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Text.Json.JsonSerializerOptions
    content.vb: Public Shared Function Create(baseOptions As JsonSerializerOptions = Nothing) As JsonSerializerOptions
  overload: PhoneNumbers.Extensions.PhoneNumberJsonOptions.Create*
- uid: PhoneNumbers.Extensions.PhoneNumberJsonOptions.Serialize(PhoneNumbers.PhoneNumber)
  commentId: M:PhoneNumbers.Extensions.PhoneNumberJsonOptions.Serialize(PhoneNumbers.PhoneNumber)
  id: Serialize(PhoneNumbers.PhoneNumber)
  parent: PhoneNumbers.Extensions.PhoneNumberJsonOptions
  langs:
  - csharp
  - vb
  name: Serialize(PhoneNumber)
  nameWithType: PhoneNumberJsonOptions.Serialize(PhoneNumber)
  fullName: PhoneNumbers.Extensions.PhoneNumberJsonOptions.Serialize(PhoneNumbers.PhoneNumber)
  type: Method
  assemblies:
  - PhoneNumbers.Extensions
  namespace: PhoneNumbers.Extensions
  summary: >-
    Serializes a <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref> to its E.164 JSON string using

    <xref href="PhoneNumbers.Extensions.PhoneNumberJsonOptions.Default" data-throw-if-not-resolved="false"></xref>. Prefer this over calling

    <code>JsonSerializer.Serialize(number, PhoneNumberJsonOptions.Default)</code> yourself: that call

    goes through the <xref href="System.Text.Json.JsonSerializerOptions" data-throw-if-not-resolved="false"></xref>-based overload, which the trimming/AOT

    analyzers always flag (IL2026/IL3050) because they cannot see that <xref href="PhoneNumbers.Extensions.PhoneNumberJsonOptions.Default" data-throw-if-not-resolved="false"></xref>

    never actually falls back to reflection. This method carries that guarantee instead, so a

    consumer project with trim/AOT analysis on gets no warning for using it.
  example: []
  syntax:
    content: >-
      [UnconditionalSuppressMessage("Trimming", "IL2026:RequiresUnreferencedCode", Justification = "Default always resolves PhoneNumber via PhoneNumberJsonContext + PhoneNumberConverter, never reflection.")]

      [UnconditionalSuppressMessage("AOT", "IL3050:RequiresDynamicCode", Justification = "Default always resolves PhoneNumber via PhoneNumberJsonContext + PhoneNumberConverter, never reflection.")]

      public static string Serialize(PhoneNumber number)
    parameters:
    - id: number
      type: PhoneNumbers.PhoneNumber
    return:
      type: System.String
    content.vb: >-
      <UnconditionalSuppressMessage("Trimming", "IL2026:RequiresUnreferencedCode", Justification:="Default always resolves PhoneNumber via PhoneNumberJsonContext + PhoneNumberConverter, never reflection.")>

      <UnconditionalSuppressMessage("AOT", "IL3050:RequiresDynamicCode", Justification:="Default always resolves PhoneNumber via PhoneNumberJsonContext + PhoneNumberConverter, never reflection.")>

      Public Shared Function Serialize(number As PhoneNumber) As String
