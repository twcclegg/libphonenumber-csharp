- uid: PhoneNumbers.Extensions.PhoneNumberJsonOptions
  commentId: T:PhoneNumbers.Extensions.PhoneNumberJsonOptions
  id: PhoneNumberJsonOptions
  parent: PhoneNumbers.Extensions
  children:
