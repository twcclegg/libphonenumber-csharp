    validity check as <xref href="PhoneNumbers.PhoneNumberUtil.IsValidNumber(PhoneNumbers.PhoneNumber)" data-throw-if-not-resolved="false"></xref> rather than a loose format

    regex. Accepts a <xref href="System.String" data-throw-if-not-resolved="false"></xref> (parsed via <xref href="PhoneNumbers.Extensions.PhoneNumberAttribute.Region" data-throw-if-not-resolved="false"></xref>) or an already-parsed

    <xref href="PhoneNumbers.PhoneNumber" data-throw-if-not-resolved="false"></xref>.
